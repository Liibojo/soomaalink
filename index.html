<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoomaaLink V27 - Video, Likes, Comments</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.header{background:#0d5a2a;padding:15px;text-align:center;font-weight:bold;font-size:20px}
.card{background:#111;border:1px solid #0d5a2a;border-radius:12px;padding:15px;margin:10px 0}
.btn{background:#0d5a2a;color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer}
input,textarea{width:100%;background:#222;color:#fff;border:1px solid #0d5a2a;border-radius:8px;padding:10px;margin:5px 0}
video{width:100%;border-radius:10px;margin:10px 0}
.like-btn{border:1px solid #0d5a2a;padding:5px 12px;border-radius:20px;background:#000;color:#0d5a2a}
.like-btn.liked{background:#0d5a2a;color:#fff}
</style>
</head>
<body>
<div class="header">🟢 SoomaaLink V27</div>

<div class="card">
<h3>📹 Video Post</h3>
<input type="file" id="vidInput" accept="video/*">
<div id="videoPreview"></div>
<textarea id="caption" placeholder="Caption qoor..."></textarea>
<button class="btn" onclick="postVideo()">Post Garee</button>
</div>

<div id="feed"></div>

<script>
let posts = JSON.parse(localStorage.getItem('soomaaV27')||'[]');
function render(){
  const feed=document.getElementById('feed');
  feed.innerHTML=posts.map((p,i)=>`
  <div class="card">
    ${p.video?`<video controls src="${p.video}"></video>`:''}
    <p>${p.caption}</p>
    <button class="like-btn ${p.liked?'liked':''}" onclick="like(${i})">❤️ ${p.likes||0}</button>
    <div style="margin-top:10px">
      <input id="cmt${i}" placeholder="Comment...">
      <button class="btn" onclick="comment(${i})">Comment</button>
      <div>${(p.comments||[]).map(c=>`<p style="background:#222;padding:5px;border-radius:5px">💬 ${c}</p>`).join('')}</div>
    </div>
  </div>`).join('');
}
function postVideo(){
  const f=document.getElementById('vidInput').files[0];
  const cap=document.getElementById('caption').value;
  if(!f &&!cap) return alert('Video ama caption dooro');
  const url=f?URL.createObjectURL(f):'';
  posts.unshift({video:url,caption:cap,likes:0,liked:false,comments:[]});
  localStorage.setItem('soomaaV27',JSON.stringify(posts));
  render(); document.getElementById('caption').value='';
}
function like(i){ posts[i].liked=!posts[i].liked; posts[i].likes+=posts[i].liked?1:-1; localStorage.setItem('soomaaV27',JSON.stringify(posts)); render(); }
function comment(i){ const inp=document.getElementById('cmt'+i); if(!inp.value) return; posts[i].comments.push(inp.value); inp.value=''; localStorage.setItem('soomaaV27',JSON.stringify(posts)); render(); }
document.getElementById('vidInput').onchange=e=>{
  const f=e.target.files[0]; if(f) document.getElementById('videoPreview').innerHTML=`<video controls src="${URL.createObjectURL(f)}"></video>`;
}
render();
</script>
</body>
</html>
