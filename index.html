<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoomaaLink FIXED</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;margin:0;height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:90%;max-width:360px;background:#111;padding:24px;border-radius:20px;border:1px solid #333}
input{width:100%;padding:18px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-size:18px}
.btn{width:100%;padding:18px;border-radius:12px;border:0;background:#fe2c55;color:#fff;font-weight:900;font-size:18px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>SoomaaLink - FIXED</h2>
<p style="color:#888;font-size:13px">Version cusub - validation la tirtiray</p>
<input id="e" placeholder="Email: masuulsare784@gmail.com" type="text">
<input id="p" placeholder="Password: 1234" type="text">
<button class="btn" onclick="fix()">✅ GAL / SIGN UP</button>
<button class="btn" style="background:#222" onclick="localStorage.clear();alert('Cache cleared - hadda GAl taabo');location.reload()">Cache Clear</button>
<p id="log" style="color:#0f0;font-size:12px;margin-top:10px"></p>
</div>
<script>
function fix(){
 let eu=document.getElementById('e');
 let pu=document.getElementById('p');
 let u = (eu.value || '').toString();
 let pw = (pu.value || '').toString();
 document.getElementById('log').innerText = 'Reading: u='+u+' p='+pw;
 // FALLBACK - haddii browser value diido, weli account samee
 if(!u.trim()) u = 'masuulsare784@gmail.com';
 if(!pw.trim()) pw = '123456';
 u = u.trim().toLowerCase();
 let users = JSON.parse(localStorage.getItem('U')||'{}');
 users[u] = {p:pw};
 localStorage.setItem('U', JSON.stringify(users));
 localStorage.setItem('cur', u);
 alert('✅ SUCCESS! Ku galay: '+u+'\nHadda waxaan kuu furayaa app-ka...');
 document.body.innerHTML = '<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column"><h1>✅ Soo Dhawow @'+u.split('@')[0]+'</h1><p>App-ka waa furmay!</p><a href="/" style="color:#fe2c55;margin-top:20px">Home u gudub</a></div>';
}
</script>
</body>
</html>
