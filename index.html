<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soomaalink V33</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#e8f5e9;min-height:100vh;display:flex;justify-content:center;padding:12px}
.card{background:white;width:100%;max-width:420px;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);border-top:6px solid #00a651;text-align:center;margin:auto}
.logo{font-size:38px;font-weight:900;color:#00a651}
.badge{background:#00a651;color:white;padding:4px 12px;border-radius:20px;font-size:11px;margin:6px 0;display:inline-block}
.btn{width:100%;background:#00a651;color:white;border:0;padding:12px;border-radius:12px;font-weight:700;margin:5px 0;cursor:pointer}
.btn2{background:white;color:#00a651;border:2px solid #00a651}
input{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:10px;margin:5px 0}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:99}
.modal>div{background:white;padding:20px;border-radius:16px;width:92%;max-width:380px;text-align:center}
.chatBox{height:300px;overflow-y:auto;background:#f1f8e9;border-radius:12px;padding:10px;text-align:left;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 12px;border-radius:12px;max-width:80%;font-size:13px}
.me{background:#00a651;color:white;align-self:flex-end}
.other{background:white;border:1px solid #ddd;align-self:flex-start}
.dash{display:none}
.row{display:flex;gap:6px}
.row input{flex:1}
</style>
</head>
<body>

<div id="home" class="card">
<div class="logo">S</div>
<span class="badge">V33 CHAT 💬</span>
<h2>Soomaalink</h2>
<p style="color:#666;font-size:12px">Chat-ka Soomaalida</p>
<div style="font-size:22px;font-weight:900;color:#00a651;margin:8px 0">€5 / month</div>
<button class="btn" onclick="openM()">Ku Biir €5 - V33</button>
<button class="btn btn2" onclick="openChat()">💬 Chat-ka Fur</button>
<small style="color:#999">soomaalink-fmzt.vercel.app<br>V33 Real Chat</small>
</div>

<div id="dash" class="card dash">
<h3 style="color:#00a651">💬 Chat - Soomaalink</h3>
<p id="welcome" style="font-size:12px;color:#00a651;margin:4px 0"></p>
<div id="chatBox" class="chatBox">
<div class="msg other">Salaam! Ku soo dhawoow Soomaalink V33 💚</div>
<div class="msg other">Halkan ku sheekeyso Soomaalida kale!</div>
</div>
<div class="row">
<input id="msgInput" placeholder="Fariin qor..." onkeypress="if(event.key==='Enter')send()">
<button class="btn" style="width:70px" onclick="send()">Dir</button>
</div>
<button class="btn btn2" onclick="showHome()">⬅️ Dib</button>
</div>

<div id="modal" class="modal"><div>
<h3 style="color:#00a651">V33 Premium €5</h3><br>
<input id="email" type="email" placeholder="Email-kaaga">
<input id="phone" placeholder="Telefon">
<button class="btn" onclick="pay()">Bixi €5 💳</button>
<button class="btn btn2" onclick="closeM()">Xir</button>
<p id="status" style="font-size:12px;color:#00a651;margin-top:8px"></p>
</div></div>

<script>
let userEmail=localStorage.getItem('s_email')||'';
if(userEmail) document.getElementById('welcome').innerText=userEmail;
let msgs=JSON.parse(localStorage.getItem('s_msgs')||'[]');
msgs.forEach(m=>addMsg(m.t,m.me));

function openM(){document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function openChat(){
 if(!userEmail){openM();document.getElementById('status').innerText='Fadlan ku biir marka hore!';return}
 showChat();
}
function showChat(){document.getElementById('home').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('welcome').innerText=userEmail+' - Premium ✅';}
function showHome(){document.getElementById('dash').style.display='none';document.getElementById('home').style.display='block';}
function pay(){
 let e=document.getElementById('email').value;
 if(!e){document.getElementById('status').innerText='Email gali!';return}
 userEmail=e;localStorage.setItem('s_email',e);
 document.getElementById('status').innerText='✅ Waad bixisay! Chat furan!';
 setTimeout(()=>{closeM();showChat()},800);
}
function addMsg(text,me){
 let d=document.createElement('div');d.className='msg '+(me?'me':'other');d.innerText=text;
 document.getElementById('chatBox').appendChild(d);
 document.getElementById('chatBox').scrollTop=9999;
}
function send(){
 let i=document.getElementById('msgInput');let t=i.value.trim();if(!t)return;
 addMsg(t,true);msgs.push({t,me:true});localStorage.setItem('s_msgs',JSON.stringify(msgs));i.value='';
 setTimeout(()=>{let replies=['Wa salaam! 😊','Waa runtaa!','Haa walaal! 💚','Mashallah!','Soomaalink waa best! 🔥'];let r=replies[Math.floor(Math.random()*replies.length)];addMsg(r,false);},1000);
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
