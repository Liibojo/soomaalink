<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;height:52px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
.header b{font-size:1.1rem;letter-spacing:.5px}

.nav button{background:none;border:0;color:#777;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;transition:.2s}
.nav button span{font-size:1.4rem}.nav button.on{color:#fff}.nav button.on span{transform:scale(1.1)}
.nav.mid{background:#fe2c55;color:#fff;border-radius:50%;width:54px;height:54px;justify-content:center;box-shadow:0 4px 12px rgba(254,44,85,.4)}
.page{position:fixed;top:0;bottom:68px;left:0;right:0;display:none;overflow-y:auto;background:#000}.page.on{display:block}
#feed{scroll-snap-type:y mandatory;height:100%;overflow-y:auto}
.post{height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:100%;height:100%;background:#000}.stage img,.stage video{width:100%;height:100%;object-fit:cover;display:block}
.info{position:absolute;left:14px;bottom:16px;right:96px;z-index:10}
.info h3{font-size:1rem;line-height:1.3;margin-bottom:4px;text-shadow:0 1px 6px #000}

.side{position:absolute;right:8px;bottom:14px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:10}
.side.ic{background:rgba(40,40,40,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;cursor:pointer;transition:.2s}
.side.ic:active{transform:scale(.9)}
.side.ic.on{background:#fe2c55;border-color:#fe2c55}

.side label{font-size:.68rem;margin-top:4px;color:#fff;text-align:center;font-weight:600}
.mute{position:absolute;top:62px;right:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.1rem;z-index:11}
.chips{display:flex;gap:8px;overflow-x:auto;padding:68px 14px 14px;scrollbar-width:none}.chip{flex:none;border:1px solid #2a2a2a;background:#111;color:#fff;padding:9px 18px;border-radius:99px;font-size:.85rem}.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 20px}.tile{background:#111;border:0;border-radius:14px;overflow:hidden;color:#fff;text-align:left;position:relative}.tile img,.tile video{width:100%;aspect-ratio:9/12;object-fit:cover;display:block}.tile p{position:absolute;left:8px;bottom:8px;right:8px;font-size:.82rem;text-shadow:0 1px 4px #000}
.txt{padding:72px 16px 20px;max-width:640px;margin:auto}
.txt h2{color:#fff;margin-bottom:12px;font-size:1.4rem}
.pcard{background:#111;border-radius:16px;padding:16px;margin-bottom:12px}
.pstat{display:flex;gap:20px;margin:14px 0}.pstat b{font-size:1.2rem;display:block}.pstat span{font-size:.75rem;color:#888}
.inboxItem{background:#111;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.inboxItem.dot{width:40px;height:40px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal[hidden]{display:none!important}
.mbox{width:100%;max-width:480px;background:#1a1a1a;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto}
.mbox h2{margin-bottom:14px;font-size:1.2rem}
.mbox input,.mbox select,.mbox textarea{width:100%;padding:13px;margin-bottom:10px;border-radius:12px;border:1px solid #2a2a2a;background:#000;color:#fff;font-size:.9rem}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#fe2c55;color:#fff;font-weight:700;margin-bottom:8px;font-size:.95rem}
.btn.alt{background:#2a2a2a}.btn:disabled{opacity:.5}
#commentList{max-height:300px;overflow-y:auto;margin-bottom:12px}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #222}
.cmt b{font-size:.85rem}.cmt p{font-size:.85rem;color:#ccc;margin-top:2px}
.shareGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px 0}
.shareGrid button{background:#222;border:0;border-radius:16px;padding:14px 6px;color:#fff;font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.shareGrid button span{font-size:1.6rem}
#status{font-size:.85rem;text-align:center;margin-bottom:10px;display:none}
</style></head><body>

<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#000;color:#fff;font-family:system-ui;overflow:hidden}.header{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(0,0,0,.9);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:20}.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:20}.nav button{background:none;border:0;color:#9aa;font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px}.nav button span{font-size:1.3rem}.nav button.on{color:#fff}.nav.mid{background:#fe2c55;color:#fff;border-radius:50%;width:52px;height:52px;justify-content:center}.page{position:fixed;top:50px;bottom:64px;left:0;right:0;display:none;overflow-y:auto}.page.on{display:block}#feed{scroll-snap-type:y mandatory;height:100%;overflow-y:auto}.post{height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage{position:relative;width:100%;height:100%;background:#000}.stage img,.stage video{width:100%;height:100%;object-fit:cover;display:block}.info{position:absolute;left:14px;bottom:18px;right:90px;text-shadow:0 1px 4px #000;z-index:10}.side{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:10}.side button{background:rgba(70,70,70,.8);border:0;color:#fff;width:52px;height:52px;border-radius:50%;font-size:1.5rem}.side small{font-size:.72rem;margin-top:3px}.mute{position:absolute;top:60px;right:14px;background:rgba(0,0,0,.6);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.1rem;z-index:11}.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}.modal[hidden]{display:none!important}.mbox{width:100%;max-width:420px;background:#111;border-radius: <div class="header"><b>SoomaaLink</b></div>
<div class="page on" id="p-home"><div id="feed"></div></div>
<div class="page" id="p-discover"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></div>
<div class="page" id="p-inbox"><div class="txt"><h2>Inbox</h2><p>Ku soo dhawow 👋</p></div></div>
<div class="page" id="p-profile"><div class="txt"><h2>Profile</h2><p id="st"></p><button class="btn alt" id="del">Tirtir</button></div></div>
<div class="modal" id="postm" hidden><div class="mbox"><h2>Ku dar muuqaal</h2><div id="status"></div><input type="file" id="pfile" accept="video/*,image/*"><input id="pt" placeholder="Magac"><select id="pc"><option>Dabeecadda</option><option>Hees</option><option>Wararka</option><option>Qosol</option><option>Quraan</option></select><button class="btn red" id="psave">Ku dar</button><button class="btn alt" id="pclose">Xidh</button></div></div>
<div class="nav"><button data-p="home" class="on"><span>🏠</span>Home</button><button data-p="discover"><span>🔍</span>Discover</button><button class="mid" id="midpost"><span>＋</span></button><button data-p="inbox"><span>💬</span>Inbox</button><button data-p="profile"><span>👤</span>Profile</button></div>
<script>
let db,VIDEOS=[];function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open("soomaalink_db",1);r.onupgradeneeded=e=>{e.target.result.createObjectStore("videos",{keyPath:"id",autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function getAll(){return new Promise((res,rej)=>{let tx=db.transaction("videos","readonly");let req=tx.objectStore("videos").getAll();req.onsuccess=()=>res(req.result);req.onerror=rej})}
function addVideo(o){return new Promise((res,rej)=>{let tx=db.transaction("videos","readwrite");let req=tx.objectStore("videos").add(o);req.onsuccess=()=>res(req.result);req.onerror=rej})}
function clearAll(){return new Promise(res=>{let tx=db.transaction("videos","readwrite");tx.objectStore("videos").clear().onsuccess=res})}
const $=id=>document.getElementById(id);const feed=$("feed");const status=$("status");
function renderFeed(){
 if(VIDEOS.length==0){feed.innerHTML=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888;padding:20px;text-align:center"><div style="font-size:3rem">📸</div><h3>Weli muuqaal ma jiro</h3><p>Guji +</p></div>`;return}
 feed.innerHTML=VIDEOS.map((v,i)=>{
  let url=URL.createObjectURL(v.blob);
  let media=v.type=="image"?`<img src="${url}">`:`<video id="vid${i}" src="${url}" loop playsinline autoplay muted></video><button class="mute" data-i="${i}">🔇</button>`;
  return `<section class="post"><div class="stage" data-i="${i}">${media}</div><div class="info"><h3>${v.title}</h3><small>@SoomaaLink · ${v.cat} - Taabo si cod u furto 🔊</small></div><div class="side"><div><button>+</button><small>Follow</small></div><div><button>♥</button><small>Like</small></div><div><button>↗</button><small>Share</small></div></div></section>`
 }).join("");
 $("st").textContent=VIDEOS.length+" muuqaal";
 document.querySelectorAll(".stage").forEach(st=>{
  st.onclick=e=>{
   if(e.target.closest(".side")||e.target.closest(".mute"))return;
   let idx=st.dataset.i;let vid=document.getElementById("vid"+idx);
   if(!vid)return;if(vid.paused){vid.play()}else{vid.muted=!vid.muted;vid.volume=1;let btn=document.querySelector(`.mute[data-i="${idx}"]`);if(btn)btn.textContent=vid.muted?"🔇":"🔊"}
  }
 });
 document.querySelectorAll(".mute").forEach(btn=>{
  btn.onclick=e=>{e.stopPropagation();let idx=btn.dataset.i;let vid=document.getElementById("vid"+idx);if(vid){vid.muted=!vid.muted;vid.volume=1;vid.play();btn.textContent=vid.muted?"🔇":"🔊"}}
 });
}
function drawDiscover(){const CATS=["Dhammaan","Dabeecadda","Hees","Wararka","Qosol","Quraan"];let cat="Dhammaan";$("chips").innerHTML=CATS.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join("");let list=VIDEOS;function renderGrid(f){$("grid").innerHTML=f.map(v=>{let url=URL.createObjectURL(v.blob);let m=v.type=="image"?`<img src="${url}">`:`<video src="${url}" muted></video>`;return `<div class="tile">${m}<p>${v.title}</p></div>`}).join("")}renderGrid(list);$("chips").onclick=e=>{let c=e.target.dataset.c;if(!c)return;cat=c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.c===c));let filtered=cat==="Dhammaan"?VIDEOS:VIDEOS.filter(v=>v.cat===cat);renderGrid(filtered)}}
async function init(){await openDB();VIDEOS=await getAll();VIDEOS=VIDEOS.reverse();renderFeed();drawDiscover()}init();
function show(p){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id==="p-"+p));document.querySelectorAll(".nav button[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===p))}
document.querySelectorAll(".nav button[data-p]").forEach(b=>b.onclick=()=>show(b.dataset.p));
$("midpost").onclick=()=>{$("postm").hidden=false};$("pclose").onclick=()=>{$("postm").hidden=true;status.style.display="none"};
$("psave").onclick=async()=>{let file=$("pfile").files[0];if(!file){alert("Fadlan dooro file");return}let btn=$("psave");btn.disabled=true;btn.textContent="Wuu kaydinayaa...";status.style.display="block";status.textContent="⏳ "+file.name;try{let title=$("pt").value.trim()||file.name;let cat=$("pc").value;let type=file.type.startsWith("image")?"image":"video";await addVideo({blob:file,title,cat,type,date:Date.now()});status.textContent="✅ Kaydsamay!";VIDEOS=await getAll();VIDEOS=VIDEOS.reverse();renderFeed();drawDiscover();setTimeout(()=>{$("postm").hidden=true;status.style.display="none";btn.disabled=false;btn.textContent="Ku dar";$("pfile").value="";$("pt").value="";show("home")},600)}catch(e){status.textContent=" "+e.message;btn.disabled=false;btn.textContent="Ku dar"}};
$("del").onclick=async()=>{if(confirm("Tirtir?")){await clearAll();VIDEOS=[];renderFeed();drawDiscover()}};
</script></body></html>
