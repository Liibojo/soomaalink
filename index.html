<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoomaaliLink - Isku Xirka Soomaalida</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f6f7f8}
header{background:#008751;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px}
.btn{padding:9px 18px;border-radius:999px;border:none;font-weight:800;cursor:pointer}
.btn-w{background:white;color:#008751}
.hero{background:linear-gradient(135deg,#008751 0%,#00c46a 100%);color:white;padding:55px 20px 40px;text-align:center}
.hero h1{font-size:32px;font-weight:900;max-width:500px;margin:0 auto 12px}
.hero p{opacity:.9;max-width:400px;margin:0 auto 22px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.feed{max-width:620px;margin:20px auto;padding:0 14px}
.input-box{display:flex;gap:10px;background:white;padding:10px;border-radius:30px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:18px}
.input-box input{flex:1;border:none;outline:none;padding:10px 14px;font-size:15px}
.post-btn{background:#008751;color:white;border:none;padding:10px 20px;border-radius:999px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo">🇸🇴 SoomaaliLink</div>
<div><button class="btn btn-w">Gal</button></div>
</header>
<div class="hero">
<h1>Isku Xirka Bulshada Soomaaliyeed</h1>
<p>Dadaab • Nairobi • Muqdisho • Qurbaha</p>
<button class="btn btn-w" style="font-size:16px;padding:12px 26px">Bilow Hada →</button>
<p style="margin-top:15px;font-size:13px">🔥 1,247 online</p>
</div>
<div class="feed" id="feed">
<div class="input-box">
<input id="postInput" placeholder="Maxaa cusub? La wadaag...">
<button class="post-btn" onclick="addPost()">Post</button>
</div>
<div id="posts">Loading...</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyCIOmLEDxgOhcl1qd9sHXtpl7-SDk86NxA",
  authDomain: "soomaalink.firebaseapp.com",
  projectId: "soomaalink",
  storageBucket: "soomaalink.firebasestorage.app",
  messagingSenderId: "11747437865",
  appId: "1:11747437865:web:569952a546d1ed8dc85b38"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
try{ await signInAnonymously(auth);}catch(e){}
const postsRef = collection(db, "posts");
const q = query(postsRef, orderBy("time","desc"));
onSnapshot(q, snap=>{
  const div=document.getElementById('posts');
  if(snap.empty){div.innerHTML='<div class="card" style="text-align:center">Wali post ma jiro - Adiga noqo ugu horeeya! 🚀</div>';return;}
  div.innerHTML="";
  snap.forEach(d=>{
    const p=d.data();
    div.innerHTML+=`<div class="card"><b style="color:#008751">Soomaali ✓</b><div style="margin-top:8px">${p.text}</div></div>`;
  });
});
window.addPost=async()=>{
  const input=document.getElementById('postInput');
  if(!input.value.trim()) return;
  const t=input.value; input.value="";
  try{ await addDoc(postsRef,{text:t,time:serverTimestamp()}); }
  catch(e){ alert("Firestore fur! Firebase → Firestore Database → Create → Test mode"); }
}
</script>
</body>
</html>
