<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoomaaLink - Somali Video Platform</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<link rel="icon" href="IMG-20261003-WA2568.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0f172a;color:white}
header{background:#1e293b;padding:16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:20px}
.logo img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:20px}
.card{background:#1e293b;border-radius:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#334155}
.card-body{padding:10px}
.hero{padding:40px 20px;text-align:center;background:linear-gradient(135deg,#3b82f6,#1e40af)}
</style>
</head>
<body>
<header><div class="logo"><img src="IMG-20261003-WA2568.jpg"> SoomaaLink</div></header>
<div class="hero"><h1>Somali Video Platform</h1><p>Daawasho, Upload, Share - Hal meel</p></div>
<div class="grid">
<div class="card"><img src="IMG-20261003-WA5502.jpg"><div class="card-body">Hees Cusub 2026 - 125K views</div></div>
<div class="card"><img src="IMG-20261003-WA5502.jpg"><div class="card-body">Wararka Maanta - 89K views</div></div>
<div class="card"><img src="IMG-20261003-WA5502.jpg"><div class="card-body">Sheeko Qosol - 210K views</div></div>
<div class="card"><img src="IMG-20261003-WA5502.jpg"><div class="card-body">Qur'aan Akhris - 300K views</div></div>
</div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
