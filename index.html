<!DOCTYPE html>
<html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SoomaaLink - Full</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui,-apple-system;height:100dvh;overflow:hidden}
.top{height:48px;background:#000;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid #222;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}.top b{border:2px solid #fff;padding:3px 8px;border-radius:6px;font-size:10px;cursor:pointer}.top span{color:#555;font-weight:700;font-size:13px;cursor:pointer;padding-bottom:4px}.top span.on{color:#fff;border-bottom:3px solid #fff}
.feed{height:calc(100dvh - 108px);overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}
.post{height:calc(100dvh - 108px);scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.big{font-size:28px;font-weight:900;text-align:center;padding:24px;line-height:1.3;z-index:2;text-shadow:0 3px 15px #000}
video, .post>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.right{position:absolute;right:8px;bottom:18px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:10}
.r{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);border:0;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}.r:active{transform:scale(.9)}.r.liked{background:rgba(255,50,80,.9);color:#fff}
.av{width:46px;height:46px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#222;cursor:pointer}.av img{width:100%;height:100%;object-fit:cover}
.bot{position:absolute;left:12px;bottom:12px;right:78px;z-index:10;text-shadow:0 2px 10px #000;line-height:1.3}
.bot b{font-size:14px}.bot p{font-size:13px;opacity:.9;margin-top:2px}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;color:#000;z-index:15}
.nav{height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center}
.nav button{background:none;border:0;color:#777;font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button.on{color:#fff}.nav button.plus{background:#fff;color:#000;width:44px;height:28px;border-radius:8px;justify-content:center;font-weight:900;font-size:18px}
.count{font-size:10px;font-weight:700;margin-top:-4px}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;flex-direction:column}.modal.show{display:flex}
.modal-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #222;font-weight:800}
.modal-body{flex:1;overflow-y:auto;padding:16px}
.input{width:100%;background:#111;border:1px solid #222;border-radius:10px;padding:12px;color:#fff;font-size:14px;margin-bottom:10px}
.btn{width:100%;background:#fff;color:#000;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}
.btn2{background:#222;color:#fff;margin-top:8px}
.user-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #111;cursor:pointer}
.cmt{padding:10px 0;border-bottom:1px solid #111}.cmt b{font-size:13px}.cmt p{font-size:13px;opacity:.8;margin-top:2px}
.tab2{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid #222;height:44px;align-items:center}.tab2 span{color:#666;font-weight:700;font-size:14px;cursor:pointer}.tab2 span.on{color:#fff;border-bottom:2px solid #fff;padding-bottom:6px}
.live-dot{width:8px;height:8px;background:#ff2d55;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style></head><body>

<div class="top">
<b id="liveBtn">LIVE</b>
<span data-tab="community">Community</span>
<span>Sarthe</span>
<span data-tab="following">Following</span>
<span>Shop</span>
<span class="on" data-tab="foryou">For You</span>
<span id="authBtn" style="margin-left:auto;color:#fff">Login</span>
</div>

<div class="feed" id="feed"></div>

<div class="nav">
<button class="on" data-nav="home">⌂<br>Home</button>
<button data-nav="friends">👥<br>Friends</button>
<button class="plus" data-nav="post">+</button>
<button data-nav="inbox">💬<br>Inbox</button>
<button data-nav="profile">👤<br>Profile</button>
</div>

<!-- COMMENT MODAL -->
<div class="modal" id="commentModal"><div class="modal-head"><span>Comments</span><span onclick="closeM('commentModal')" style="font-size:22px;cursor:pointer">×</span></div><div class="modal-body" id="commentList"></div><div style="padding:12px;display:flex;gap:8px;border-top:1px solid #222"><input id="cmtInput" class="input" style="margin:0" placeholder="Qor comment..."><button class="btn" style="width:70px" onclick="addComment()">Dir</button></div></div>

<!-- PROFILE / FRIENDS / INBOX / POST / AUTH MODALS -->
<div class="modal" id="pageModal"><div class="modal-head"><span id="pageTitle">Page</span><span onclick="closeM('pageModal')" style="font-size:22px;cursor:pointer">×</span></div><div class="modal-body" id="pageBody"></div></div>

<div class="modal" id="postModal"><div class="modal-head"><span>Post Cusub</span><span onclick="closeM('postModal')" style="font-size:22px;cursor:pointer">×</span></div><div class="modal-body"><textarea id="postText" class="input" rows="3" placeholder="Maxaa cusub?"></textarea><input id="postMedia" class="input" placeholder="Link muuqaal/sawir (optional)"><button class="btn" onclick="createPost()">Post</button><button class="btn btn2" onclick="closeM('postModal')">Cancel</button></div></div>

<div class="modal" id="authModal"><div class="modal-head"><span id="authTitle">Login</span><span onclick="closeM('authModal')" style="font-size:22px;cursor:pointer">×</span></div><div class="modal-body"><input id="aUser" class="input" placeholder="Magac"><input id="aPass" type="password" class="input" placeholder="Password"><button class="btn" id="authAction" onclick="doAuth()">Login</button><button class="btn btn2" onclick="toggleAuth()">Ma leedahay account? Sign Up</button></div></div>

<script>
let currentUser = JSON.parse(localStorage.getItem('sl_user')||'null');
let posts = JSON.parse(localStorage.getItem('sl_posts')||'null') || [
{id:1,user:'soomaalink',avatar:'https://i.pravatar.cc/100?u=beach',text:'Qorrax dhac qurux badan - Badda iyo shimbiraha',media:'VID-20261004-WA0144.mp4',type:'video',likes:3200,liked:false,comments:[{user:'Ahmed',text:'Mashallah xeeb qurux!'}],time:'Xeebta 🌅'},
{id:2,user:'Ahmed',avatar:'https://i.pravatar.cc/100?u=1',text:'Waxbarashu maaha wax caajis ah marka aad xaqiiqsato inay tahay tigidka xornimada.',media:'',type:'text',bg:'#111',likes:890,liked:false,comments:[],time:'Waxbarashu waa iftiin ✨'},
{id:3,user:'liibaan_music',avatar:'https://i.pravatar.cc/100?u=kaban',text:'Hees kaban macaan 🎸 #kaban',media:'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=900',type:'image',likes:279000,liked:true,comments:[{user:'Sahra',text:'Cod macaan!'}],time:'Music'},
{id:4,user:'bahal_ceyjiye',avatar:'https://i.pravatar.cc/100?u=bahal',text:'IXTIRAAMKU waa toban, Sagaal Ka mid ah waa Aamusnaan ❤️',media:'',type:'text',bg:'#0f1f15',likes:1200,liked:false,comments:[],time:'Xikmad'}
];
let friends = [{name:'Ahmed',handle:'@Ahmed',followers:'12K',following:true},{name:'Sahra',handle:'@sahra_music',followers:'45K',following:false},{name:'Liibaan',handle:'@liibaan_music',followers:'89K',following:true}];
let followingCount = 128, followersCount = 3420;
let currentPostId = null;
let authMode='login';

function save(){localStorage.setItem('sl_posts',JSON.stringify(posts)); localStorage.setItem('sl_user',JSON.stringify(currentUser));}

function renderFeed(filter='foryou'){
 let f=document.getElementById('feed'); f.innerHTML='';
 let list=[...posts];
 if(filter==='following') list=list.filter(p=>p.liked);
 if(filter==='community') list=list.slice().reverse();
 list.forEach(p=>{
  let el=document.createElement('div'); el.className='post'; if(p.bg) el.style.background=p.bg;
  let media='';
  if(p.type==='video') media=`<video loop playsinline ${p.media.includes('VID')?'':''} src="${p.media}" poster="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"></video><div class="play" onclick="playV(this)">▶</div>`;
  else if(p.type==='image') media=`<img class="bg" src="${p.media}">`;
  else media=`<div class="big">${p.text}</div>`;
  el.innerHTML=media+`
  <div class="right">
    <div class="av" onclick="openProfile('${p.user}')"><img src="${p.avatar}"></div>
    <div class="r ${p.liked?'liked':''}" onclick="like(${p.id})">${p.liked?'♥':'♡'}</div><div class="count">${fmt(p.likes)}</div>
    <div class="r" onclick="openComments(${p.id})">💬</div><div class="count">${p.comments.length}</div>
    <div class="r" onclick="savePost(${p.id})">🔖</div>
    <div class="r" onclick="share(${p.id})">↗</div>
  </div>
  <div class="bot"><b>@${p.user} • ${p.time}</b><p>${p.text}</p><p>♫ Original audio</p></div>`;
  if(p.type!=='text') el.setAttribute('onclick','playV(this)');
  f.appendChild(el);
 });
 updateAuthBtn();
}

function fmt(n){if(n>=1000) return (n/1000).toFixed(n>=10000?0:1)+'K'; return n;}
function playV(el){
 let v=el.querySelector?el.querySelector('video'):el.parentElement.querySelector('video');
 if(!v) return; let pl=el.querySelector?el.querySelector('.play'):el.parentElement.querySelector('.play');
 if(v.paused){v.muted=false; v.play(); if(pl) pl.style.display='none';} else {v.pause(); if(pl) pl.style.display='flex';}
}
function like(id){let p=posts.find(x=>x.id===id); p.liked=!p.liked; p.likes+=p.liked?1:-1; save(); renderFeed(document.querySelector('.top span.on')?.dataset.tab||'foryou');}
function openComments(id){currentPostId=id; let p=posts.find(x=>x.id===id); let list=document.getElementById('commentList'); list.innerHTML=p.comments.map(c=>`<div class="cmt"><b>@${c.user}</b><p>${c.text}</p></div>`).join('')||'<p style="opacity:.5">Comment ma jiro - noqo kii ugu horeeya!</p>'; document.getElementById('commentModal').classList.add('show');}
function addComment(){let t=document.getElementById('cmtInput').value.trim(); if(!t) return; if(!currentUser) return showAuth(); let p=posts.find(x=>x.id===currentPostId); p.comments.push({user:currentUser.name,text:t}); document.getElementById('cmtInput').value=''; save(); openComments(currentPostId); renderFeed();}
function share(id){let p=posts.find(x=>x.id===id); let url=location.href+'#post-'+id; if(navigator.share){navigator.share({title:'SoomaaLink',text:p.text,url})} else {navigator.clipboard.writeText(url); alert('Link copied! 🔗\n'+url);} }
function savePost(id){alert('Saved! 🔖 Post #'+id+' wuu ku kaydsan yahay Profile-kaaga');}
function closeM(id){document.getElementById(id).classList.remove('show');}
function showAuth(){document.getElementById('authModal').classList.add('show');}
function toggleAuth(){authMode=authMode==='login'?'signup':'login'; document.getElementById('authTitle').innerText=authMode==='login'?'Login':'Sign Up'; document.getElementById('authAction').innerText=authMode==='login'?'Login':'Sign Up';}
function doAuth(){let u=document.getElementById('aUser').value.trim(), pw=document.getElementById('aPass').value.trim(); if(!u||!pw) return alert('Magac iyo password geli'); currentUser={name:u}; save(); closeM('authModal'); updateAuthBtn(); alert('Ku soo dhawoow @'+u+'! 🎉'); renderFeed();}
function updateAuthBtn(){let b=document.getElementById('authBtn'); b.innerText=currentUser?'@'+currentUser.name:'Login';}

function openPage(title,html){document.getElementById('pageTitle').innerText=title; document.getElementById('pageBody').innerHTML=html; document.getElementById('pageModal').classList.add('show');}
function openProfile(user){
 let u=posts.filter(p=>p.user===user); openPage('@'+user,`
 <div style="text-align:center;padding:20px"><div class="av" style="width:80px;height:80px;margin:0 auto"><img src="${posts.find(p=>p.user===user)?.avatar||'https://i.pravatar.cc/100'}"></div><h2 style="margin-top:10px">@${user}</h2><div style="display:flex;justify-content:center;gap:24px;margin:14px 0"><div><b>${followingCount}</b><br><span style="font-size:12px;opacity:.6">Following</span></div><div><b>${followersCount}</b><br><span style="font-size:12px;opacity:.6">Followers</span></div><div><b>${u.length}</b><br><span style="font-size:12px;opacity:.6">Likes</span></div></div><button class="btn" onclick="follow('${user}')">Follow</button></div>
 <div class="tab2"><span class="on">Posts</span><span>Liked</span></div>
 <div>${u.map(p=>`<div style="padding:12px;border-bottom:1px solid #111"><b>${p.type.toUpperCase()}</b> - ${p.text.slice(0,60)}<br><small>❤ ${fmt(p.likes)} | 💬 ${p.comments.length}</small></div>`).join('')}</div>
 `);
}
function follow(user){followersCount++; alert('Waxaad Follow gareysay @'+user+' ✅'); openPage('@'+user+' Followed','<p style="text-align:center;padding:30px">✅ Following @'+user+'<br><br>Followers: '+followersCount+'</p>');}

// NAV
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
 let nav=b.dataset.nav;
 if(nav==='home') renderFeed();
 if(nav==='friends'){ openPage('Friends', friends.map(f=>`<div class="user-row"><div class="av"><img src="https://i.pravatar.cc/100?u=${f.name}"></div><div style="flex:1"><b>${f.name}</b><br><small style="opacity:.6">${f.handle} • ${f.followers}</small></div><button class="btn" style="width:80px;padding:8px" onclick="this.innerText=this.innerText==='Follow'?'Following':'Follow'">${f.following?'Following':'Follow'}</button></div>`).join('')); }
 if(nav==='inbox'){ openPage('Inbox', `<div>${friends.map(f=>`<div class="user-row"><div class="av"><img src="https://i.pravatar.cc/100?u=${f.name}"></div><div style="flex:1"><b>${f.name}</b><br><small style="opacity:.6">Salaam saaxiib! 👋</small></div><small>2m</small></div>`).join('')}<p style="opacity:.5;text-align:center;margin-top:20px">Inbox waa demo - chat dhab ah wuu iman doonaa!</p></div>`); }
 if(nav==='profile'){ if(!currentUser) return showAuth(); openPage('Profile',`
  <div style="text-align:center;padding:20px"><div class="av" style="width:80px;height:80px;margin:0 auto"><img src="https://i.pravatar.cc/100?u=${currentUser.name}"></div><h2>@${currentUser.name}</h2><p style="opacity:.6;font-size:12px">Le Grand-Quevilly, France</p>
  <div style="display:flex;justify-content:center;gap:24px;margin:14px 0"><div style="cursor:pointer" onclick="openPage('Following','<p>Following ${followingCount} accounts</p>')"><b>${followingCount}</b><br><small>Following</small></div><div style="cursor:pointer" onclick="openPage('Followers','<p>Followers ${followersCount} - waa dadka ku jecel!</p>')"><b>${followersCount}</b><br><small>Followers</small></div><div><b>${posts.filter(p=>currentUser&&p.user===currentUser.name).length}</b><br><small>Posts</small></div></div>
  <button class="btn btn2" onclick="localStorage.clear(); location.reload()">Logout</button></div>
  <div class="tab2"><span class="on">Your Posts</span><span>Liked</span><span>Saved</span></div>
  <div>${posts.filter(p=>currentUser&&p.user===currentUser.name).map(p=>`<div style="padding:12px;border-bottom:1px solid #111">${p.text}</div>`).join('')||'<p style="opacity:.5;text-align:center;padding:20px">Post ma sameysin weli - taabo + si aad u bilowdo!</p>'}</div>
 `); }
 if(nav==='post'){ if(!currentUser) return showAuth(); document.getElementById('postModal').classList.add('show'); }
}));
document.querySelectorAll('.top span').forEach(s=>s.addEventListener('click',()=>{document.querySelectorAll('.top span').forEach(x=>x.classList.remove('on')); s.classList.add('on'); renderFeed(s.dataset.tab||'foryou');}));
document.getElementById('liveBtn').addEventListener('click',()=>{openPage('LIVE 🔴',`<div style="text-align:center;padding:20px"><div class="live-dot"></div> <b>LIVE NOW</b><br><br><div style="background:#111;padding:20px;border-radius:12px">🎥 ${currentUser?currentUser.name:'User'} is LIVE<br><small style="opacity:.6">128 viewers</small><br><br><button class="btn" onclick="alert('LIVE wuu bilaabmayaa! (demo)')">Go LIVE</button></div><p style="opacity:.5;margin-top:20px">LIVE feature dhab ah wuxuu u baahan yahay server - hadda waa demo!</p></div>`);});
document.getElementById('authBtn').addEventListener('click',()=>{if(currentUser){document.querySelector('[data-nav=profile]').click();} else showAuth();});

function createPost(){let t=document.getElementById('postText').value.trim(), m=document.getElementById('postMedia').value.trim(); if(!t&&!m) return alert('Qoraal ama muuqaal geli'); let type='text'; if(m){ type=m.match(/\.mp4|video/i)?'video':'image'; } let newPost={id:Date.now(),user:currentUser.name,avatar:'https://i.pravatar.cc/100?u='+currentUser.name,text:t||'Post cusub',media:m,type:type,likes:0,liked:false,comments:[],time:'Just now'}; posts.unshift(newPost); save(); closeM('postModal'); document.getElementById('postText').value=''; document.getElementById('postMedia').value=''; renderFeed(); alert('Post wuu baxay! 🎉');}

renderFeed();
</script>
</body></html>
