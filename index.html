<!DOCTYPE html>
<html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SoomaaLink - Touch Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden;touch-action:manipulation}
.top{height:50px;background:#000;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid #222;overflow-x:auto;white-space:nowrap;position:relative;z-index:100}
.top b{border:2px solid #fff;padding:3px 7px;border-radius:6px;font-size:11px}.top span{color:#666;font-weight:700;font-size:14px}.top span.on{color:#fff;border-bottom:3px solid #fff;padding-bottom:5px}
.feed{height:calc(100dvh - 110px);overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.post{height:calc(100dvh - 110px);scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.big{font-size:32px;font-weight:900;text-align:center;padding:28px;line-height:1.25;pointer-events:none}
.right{position:absolute;right:10px;bottom:22px;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:50;pointer-events:auto}
.r{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);border:0;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}
.av{width:50px;height:50px;border-radius:50%;border:2px solid #fff;overflow:hidden;position:relative;background:#333;pointer-events:auto}.av img{width:100%;height:100%;object-fit:cover}
.bot{position:absolute;left:12px;bottom:12px;right:85px;z-index:10;pointer-events:none;text-shadow:0 1px 8px #000}
.pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:rgba(0,0,0,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;z-index:20;pointer-events:auto;border:2px solid rgba(255,255,255,.8);cursor:pointer}
.nav{height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;position:relative;z-index:100}
.nav button{background:none;border:0;color:#777;font-size:10px;pointer-events:auto}
.nav button.on{color:#fff}
</style></head><body>
<div class="top"><b>LIVE</b><span>Community</span><span>Sarthe</span><span>Following</span><span>Shop</span><span class="on">For You</span></div>
<div class="feed" id="feed">
<div class="post" style="background:#000"><img class="th" src="https://i.ytimg.com/vi/jNQXAC9IVRw/hqdefault.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><div class="pl">▶</div><div class="right"><div class="av"><img src="https://i.pravatar.cc/100?u=1"></div><button class="r">♥</button><div style="font-size:11px">279K</div><button class="r">💬</button><div style="font-size:11px">693</div><button class="r">🔖</button><div style="font-size:11px">5K</div><button class="r">↗</button><div style="font-size:11px">3K</div></div><div class="bot"><b>@liibaan_music</b><br>Hees kaban macaan 🎸 #kaban #soomaali<br>♫ Taabo dhexda si loo shido</div></div>
<div class="post" style="background:#1a1a1a"><div class="big">Waxbarashu maaha wax caajis ah marka aad xaqiiqsato inay tahay tigidka xornimada.</div><div class="right"><div class="av"><img src="https://i.pravatar.cc/100?u=2"></div><button class="r">♡</button><button class="r">💬</button><button class="r">🔖</button><button class="r">↗</button></div><div class="bot"><b>@Ahmed</b><br>Qoraal weyn - taabo meel kasta</div></div>
<div class="post" style="background:#000"><img class="th" src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><div class="pl">▶</div><div class="right"><div class="av"><img src="https://i.pravatar.cc/100?u=3"></div><button class="r">♥</button><div style="font-size:11px">12K</div><button class="r">💬</button><button class="r">🔖</button><button class="r">↗</button></div><div class="bot"><b>@qosol_tv</b><br>Qosolkii maanta 😂</div></div>
</div>
<div class="nav"><button class="on">⌂<br>Home</button><button>👥<br>Friends</button><button style="background:#fff;color:#000;width:44px;height:28px;border-radius:8px;font-weight:900">+</button><button>💬<br>Inbox</button><button>👤<br>Profile</button></div>
<script>
const feed=document.getElementById('feed');
feed.addEventListener('click',function(e){
 let post=e.target.closest('.post'); if(!post) return;
 if(e.target.closest('.right') || e.target.closest('.r')){ e.stopPropagation(); let btn=e.target.closest('.r'); if(btn){btn.style.background='#fe2c55';} return; }
 let iframe=post.querySelector('iframe'); let th=post.querySelector('.th'); let pl=post.querySelector('.pl');
 if(iframe){ iframe.remove(); if(th) th.style.display='block'; if(pl) pl.style.display='flex'; return; }
 if(th){ let m=th.src.match(/vi\/([^\/]+)\//); if(!m) return; th.style.display='none'; if(pl) pl.style.display='none'; let f=document.createElement('iframe'); f.style='position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5'; f.src='https://www.youtube.com/embed/'+m[1]+'?autoplay=1&playsinline=1&rel=0&controls=1'; f.allow='autoplay;fullscreen;encrypted-media'; f.allowFullscreen=true; post.appendChild(f); }
}, true);
// Touch for mobile
feed.addEventListener('touchend',function(e){
 let post=e.target.closest('.post'); if(!post) return; if(e.target.closest('.right')) return;
}, {passive:false});
</script>
</body></html>
