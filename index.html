<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoomaaLink - Somali Video Platform</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<meta name="theme-color" content="#2563eb">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:white;font-family:Arial}
.header{background:#1e293b;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.logo{width:40px;height:40px;border-radius:10px}
.banner{background:linear-gradient(135deg,#2563eb,#1e40af);padding:40px 20px;text-align:center}
.banner h1{font-size:28px;margin-bottom:8px}
.banner p{opacity:0.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#1e293b;border-radius:12px;overflow:hidden}
.thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:40px}
.c1{background:linear-gradient(135deg,#ef4444,#dc2626)}
.c2{background:linear-gradient(135deg,#10b981,#059669)}
.c3{background:linear-gradient(135deg,#f59e0b,#d97706)}
.c4{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.info{padding:12px}
.info h3{font-size:14px;margin-bottom:4px}
.info p{font-size:12px;opacity:0.6}
</style>
</head>
<body>
<div class="header">
<img src="icon-512.png" class="logo" onerror="this.src='icon-192.png'">
<b>SoomaaLink</b>
</div>
<div class="banner">
<h1>Somali Video Platform</h1>
<p>Daawasho, Upload, Share - Hal meel</p>
</div>
<div class="grid">
<div class="card"><div class="thumb c1">🎵</div><div class="info"><h3>Hees Cusub 2026</h3><p>125K views</p></div></div>
<div class="card"><div class="thumb c2">📰</div><div class="info"><h3>Wararka Maanta</h3><p>89K views</p></div></div>
<div class="card"><div class="thumb c3">😂</div><div class="info"><h3>Sheeko Qosol</h3><p>210K views</p></div></div>
<div class="card"><div class="thumb c4">📖</div><div class="info"><h3>Qur'aan Akhris</h3><p>300K views</p></div></div>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
