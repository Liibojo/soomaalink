<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoomaaLink</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden;height:100vh}
.header{position:fixed;top:0;left:0;right:0;height:54px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222;z-index:10}
.nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:10}
.nav button{background:0;border:0;color:#888;font-size:.7rem;display:flex;flex-direction:column;align-items:center}
.nav button.on{color:#fff}.nav button.mid{background:#fe2c55;color:#fff;width:56px;height:56px;border-radius:50%;justify-content:center;font-size:1.8rem}
.page{position:fixed;top:54px;bottom:66px;left:0;right:0;display:none;overflow:auto}.page.on{display:block}
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.post{height:100%;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.post video,.post img{width:100%;height:100%;object-fit:cover}
.info{position:absolute;left:12px;bottom:16px;right:80px;text-shadow:0 1px 5px #000}
.side{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:16px}
.side button{width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.4rem}.side button.on{background:#fe2c55}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal[hidden]{display:none!important}
.box{width:100%;max-width:380px;background:#1e1e1e;border-radius:20px;padding:20px;border:1px solid #333}
.box input{width:100%;padding:14px;margin-bottom:12px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-size:16px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-weight:700}.tabs button.on{background:#fff;color:#000}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:#fe2c55;color:#fff;font-weight:800;font-size:16px}
.btn.gray{background:#333;margin-top:8px}
</style>
</head>
<body>
<div class="header"><b>SoomaaLink</b><small id="uLabel" style="color:#0f0"></small></div>
<div class="page on" id="p-home"><div id="feed"></div></div>
<div class="page" id="p-discover"><div style="padding:20px;color:#888;text-align:center">Discover - videos halkan</div><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px"></div></div>
<div class="page" id="p-inbox"><div id="inbox" style="padding:14px"></div></div>
<div class="page" id="p-profile"><div id="prof" style="padding:14px"></div></div>

<!-- AUTH FIXED -->
<div class="modal" id="authModal">
<div class="box">
<h2 id="aTitle">Is Diiwaan Geli</h2>
<div class="tabs">
<button id="btnLogin" onclick="setMode('login')">Login</button>
<button id="btnSignup" class="on" onclick="setMode('signup')">Sign Up</button>
</div>
<input id="aUser" placeholder="Email ama Number - tusaale: ali@gmail.com ama 063... " autocomplete="off">
<input id="aPass" type="password" placeholder="Password (6 xaraf)">
<button class="btn" id="aAction" onclick="doAuth()">Sign Up</button>
<p style="font-size:.7rem;color:#666;text-align:center;margin-top:8px" id="aHint">Sign Up: Email ama Number cusub gali</p>
</div>
</div>

<div class="modal" id="postModal" hidden><div class="box">
<h3>Video cusub ku dar</h3><br>
<input type="file" id="fFile" accept="video/*,image/*">
<input id="fTitle" placeholder="Magac">
<button class="btn" id="fSave">Ku dar</button>
<button class="btn gray" onclick="closeModal('postModal')">Xidh</button>
</div></div>

<div class="modal" id="cmtModal" hidden><div class="box" style="max-height:80vh;display:flex;flex-direction:column">
<h3>Comments</h3><div id="cmtList" style="flex:1;overflow:auto;margin:12px 0;max-height:40vh"></div>
<div style="display:flex;gap:8px"><input id="cmtIn" placeholder="Comment..."><button class="btn" style="width:auto" onclick="addCmt()">Dir</button></div>
<button class="btn gray" onclick="closeModal('cmtModal')">Xidh</button>
</div></div>

<div class="nav">
<button data-p="home" class="on" onclick="showP('home')">🏠<br>Home</button>
<button data-p="discover" onclick="showP('discover')">🔍<br>Discover</button>
<button class="mid" onclick="openModal('postModal')">+</button>
<button data-p="inbox" onclick="showP('inbox')">📥<br>Inbox</button>
<button data-p="profile" onclick="showP('profile')">👤<br>Profile</button>
</div>

<script>
let db,VIDS=[],CUR=null,MODE='signup',CUR_CMT=null;
let likes=JSON.parse(localStorage.getItem('s_likes')||'{}');
let follows=JSON.parse(localStorage.getItem('s_follows')||'{}');
let cmts=JSON.parse(localStorage.getItem('s_cmts')||'{}');
let users=JSON.parse(localStorage.getItem('s_users')||'{}');
let inbox=JSON.parse(localStorage.getItem('s_inbox')||'[]');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('s_likes',JSON.stringify(likes));localStorage.setItem('s_follows',JSON.stringify(follows));localStorage.setItem('s_cmts',JSON.stringify(cmts));localStorage.setItem('s_users',JSON.stringify(users));localStorage.setItem('s_inbox',JSON.stringify(inbox))}
function openModal(id){$(id).hidden=false} function closeModal(id){$(id).hidden=true}
function showP(p){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));document.querySelectorAll('.nav button[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); if(p==='profile')renderProf(); if(p==='discover')renderGrid()}
function setMode(m){
 MODE=m;
 $('btnLogin').classList.toggle('on',m==='login');
 $('btnSignup').classList.toggle('on',m==='signup');
 $('aTitle').textContent=m==='login'?'Soo Gal':'Is Diiwaan Geli';
 $('aAction').textContent=m==='login'?'Login':'Sign Up';
 $('aHint').textContent=m==='login'?'Login: Email/Number horey u diiwaan gashan':'Sign Up: Email ama Number cusub gali';
}
function doAuth(){
 let u=$('aUser').value.trim().toLowerCase();
 let p=$('aPass').value.trim();
 console.log('Auth try',MODE,u);
 if(!u||!p){alert('Email/Number iyo Password qor!');return}
 if(p.length<3){alert('Password ugu yaraan 3 xaraf');return}
 if(u.length<4){alert('Email ama Number aad u gaaban');return}

 if(MODE==='signup'){
  if(users[u]){alert('Account-kan wuu jiraa! Hadda Login samee'); setMode('login'); return}
  users[u]={pass:p,date:Date.now()};
  save();
  CUR=u;
  localStorage.setItem('s_cur',CUR);
  alert('✅ Account waa la sameeyay! '+u);
  $('authModal').hidden=true;
  checkAuth();
 }else{
  if(!users[u]){alert('Account-kan ma jiro! Sign Up samee'); setMode('signup'); return}
  if(users[u].pass!==p){alert('Password khalad!');return}
  CUR=u;
  localStorage.setItem('s_cur',CUR);
  alert('✅ Soo dhawow '+u);
  $('authModal').hidden=true;
  checkAuth();
 }
 $('aUser').value=''; $('aPass').value='';
}
function checkAuth(){
 CUR=localStorage.getItem('s_cur');
 if(!CUR){ $('authModal').hidden=false; setMode('signup'); }
 else{ $('authModal').hidden=true; $('uLabel').textContent='@'+(CUR.includes('@')?CUR.split('@')[0]:CUR); }
}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('sl',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('v',{keyPath:'id',autoIncrement:true});r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function getAll(){return new Promise((res,rej)=>{let tx=db.transaction('v','readonly');let rq=tx.objectStore('v').getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=rej})}
function addV(o){return new Promise((res,rej)=>{let tx=db.transaction('v','readwrite');let rq=tx.objectStore('v').add(o);rq.onsuccess=()=>res(rq.result);rq.onerror=rej})}
function renderFeed(){
 let f=$('feed');
 if(!VIDS.length){ f.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#666"><div style="font-size:3rem">📸</div><p>Weli video ma jiro<br>+ taabo ku dar</p></div>'; return}
 f.innerHTML=VIDS.map(v=>{
  let url=URL.createObjectURL(v.blob);
  let media=v.type==='image'?`<img src="${url}">`:`<video src="${url}" loop muted autoplay playsinline onclick="this.muted=!this.muted"></video>`;
  let lc=(cmts[v.id]||[]).length;
  return `<div class="post">${media}<div class="info"><h3>${v.title}</h3><small>@${(v.owner||'').split('@')[0]} - Taabo video codka fur</small></div><div class="side"><button class="${follows[v.id]?'on':''}" onclick="togF(${v.id})">${follows[v.id]?'✓':'+'}</button><button class="${likes[v.id]?'on':''}" onclick="togL(${v.id})">♥</button><button onclick="openC(${v.id})">💬<br><small>${lc}</small></button><button onclick="share()">↗</button></div></div>`
 }).join('');
}
function togL(id){if(!CUR){$('authModal').hidden=false;return} likes[id]=!likes[id]; save(); renderFeed()}
function togF(id){if(!CUR){$('authModal').hidden=false;return} follows[id]=!follows[id]; save(); renderFeed()}
function share(){if(navigator.share)navigator.share({title:'SoomaaLink',url:location.href});else{ navigator.clipboard.writeText(location.href); alert('Link copied')}}
function openC(id){CUR_CMT=id; openModal('cmtModal'); renderC()}
function renderC(){ let list=cmts[CUR_CMT]||[]; $('cmtList').innerHTML=list.length?list.map(c=>`<div style="padding:8px 0;border-bottom:1px solid #222"><b>@${c.u.split('@')[0]}</b><br>${c.t}</div>`).join(''):'<p style="color:#666">Weli comment ma jiro</p>'}
function addCmt(){ let t=$('cmtIn').value.trim(); if(!t)return; if(!cmts[CUR_CMT])cmts[CUR_CMT]=[]; cmts[CUR_CMT].push({u:CUR,t,dt:Date.now()}); save(); $('cmtIn').value=''; renderC(); renderFeed()}
function renderGrid(){ $('grid').innerHTML=VIDS.map(v=>{let url=URL.createObjectURL(v.blob);return `<div style="background:#111;border-radius:10px;overflow:hidden"><video src="${url}" muted style="width:100%;aspect-ratio:9/13;object-fit:cover"></video><p style="padding:6px;font-size:.8rem">${v.title}</p></div>`}).join('')}
function renderProf(){ let my=VIDS.filter(v=>v.owner===CUR); $('prof').innerHTML=`<div style="text-align:center;padding:20px"><div style="width:70px;height:70px;background:#fe2c55;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:1.5rem">${(CUR||'?')[0].toUpperCase()}</div><h2>@${CUR?CUR.split('@')[0]:''}</h2><small>${CUR||''}</small><br><br><div style="display:flex;justify-content:space-around"><div><b>${my.length}</b><br>Videos</div><div><b>${Object.keys(follows).length}</b><br>Followers</div><div><b>${Object.keys(likes).length}</b><br>Likes</div></div><br><button class="btn gray" onclick="localStorage.removeItem('s_cur');location.reload()">Log Out</button></div>` }

async function init(){ await openDB(); VIDS=(await getAll()).reverse(); checkAuth(); setMode('signup'); renderFeed(); } init();

$('fSave').onclick=async()=>{
 let file=$('fFile').files[0]; if(!file){alert('Dooro file');return}
 let b=$('fSave'); b.disabled=true; b.textContent='...';
 await addV({blob:file,title:$('fTitle').value||file.name,type:file.type.startsWith('image')?'image':'video',owner:CUR,date:Date.now()});
 VIDS=(await getAll()).reverse(); renderFeed(); closeModal('postModal'); $('fFile').value=''; $('fTitle').value='';
 b.disabled=false; b.textContent='Ku dar';
};
</script>
</body>
</html><!DOCTYPE html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SoomaaLink</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#000;color:#fff;font-family:system-ui;overflow:hidden}.header{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(0,0,0,.9);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:20}.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:20}.nav button{background:none;border:0;color:#9aa;font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px}.nav button span{font-size:1.3rem}.nav button.on{color:#fff}.nav.mid{background:#fe2c55;color:#fff;border-radius:50%;width:52px;height:52px;justify-content:center}.page{position:fixed;top:50px;bottom:64px;left:0;right:0;display:none;overflow-y:auto}.page.on{display:block}#feed{scroll-snap-type:y mandatory;height:100%;overflow-y:auto}.post{height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage{position:relative;width:100%;height:100%;background:#000}.stage img,.stage video{width:100%;height:100%;object-fit:cover;display:block}.info{position:absolute;left:14px;bottom:18px;right:90px;text-shadow:0 1px 4px #000;z-index:10}.side{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:10}.side button{background:rgba(70,70,70,.8);border:0;color:#fff;width:52px;height:52px;border-radius:50%;font-size:1.5rem}.side small{font-size:.72rem;margin-top:3px}.mute{position:absolute;top:60px;right:14px;background:rgba(0,0,0,.6);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.1rem;z-index:11}.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}.modal[hidden]{display:none!important}.mbox{width:100%;max-width:420px;background:#111;border-radius:16px;padding:18px}.mbox input,.mbox select{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #333;background:#000;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;margin-bottom:8px}.btn.alt{background:#222}.btn.red{background:#fe2c55}.chips{display:flex;gap:8px;overflow-x:auto;padding:14px}.chip{flex:none;border:1px solid #333;background:none;color:#fff;padding:8px 16px;border-radius:99px}.chip.on{background:#2563eb;border-color:#2563eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 20px}.tile{background:#111;border:0;border-radius:12px;overflow:hidden;color:#fff;text-align:left}.tile img,.tile video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.tile p{padding:8px 10px;font-size:.85rem}.txt{padding:20px 16px;max-width:640px;margin:auto;line-height:1.6;color:#cfd6e4}.txt h2{color:#fff;margin-bottom:10px}#status{font-size:.8rem;color:#0f0;text-align:center;margin-bottom:8px;display:none}
</style></head><body>
<div class="header"><b>SoomaaLink</b></div>
<div class="page on" id="p-home"><div id="feed"></div></div>
<div class="page" id="p-discover"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></div>
<div class="page" id="p-inbox"><div class="txt"><h2>Inbox</h2><p>Ku soo dhawow 👋</p></div></div>
<div class="page" id="p-profile"><div class="txt"><h2>Profile</h2><p id="st"></p><button class="btn alt" id="del">Tirtir</button></div></div>
<div class="modal" id="postm" hidden><div class="mbox"><h2>Ku dar muuqaal</h2><div id="status"></div><input type="file" id="pfile" accept="video/*,image/*"><input id="pt" placeholder="Magac"><select id="pc"><option>Dabeecadda</option><option>Hees</option><option>Wararka</option><option>Qosol</option><option>Quraan</option></select><button class="btn red" id="psave">Ku dar</button><button class="btn alt" id="pclose">Xidh</button></div></div>
<div class="nav"><button data-p="home" class="on"><span>🏠</span>Home</button><button data-p="discover"><span>🔍</span>Discover</button><button class="mid" id="midpost"><span>＋</span></button><button data-p="inbox"><span>💬</span>Inbox</button><button data-p="profile"><span>👤</span>Profile</button></div>
<script>
let db,VIDEOS=[];function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open("soomaalink_db",1);r.onupgradeneeded=e=>{e.target.result.createObjectStore("videos",{keyPath:"id",autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function getAll(){return new Promise((res,rej)=>{let tx=db.transaction("videos","readonly");let req=tx.objectStore("videos").getAll();req.onsuccess=()=>res(req.result);req.onerror=rej})}
function addVideo(o){return new Promise((res,rej)=>{let tx=db.transaction("videos","readwrite");let req=tx.objectStore("videos").add(o);req.onsuccess=()=>res(req.result);req.onerror=rej})}
function clearAll(){return new Promise(res=>{let tx=db.transaction("videos","readwrite");tx.objectStore("videos").clear().onsuccess=res})}
const $=id=>document.getElementById(id);const feed=$("feed");const status=$("status");
function renderFeed(){
 if(VIDEOS.length==0){feed.innerHTML=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888;padding:20px;text-align:center"><div style="font-size:3rem">📸</div><h3>Weli muuqaal ma jiro</h3><p>Guji +</p></div>`;return}
 feed.innerHTML=VIDEOS.map((v,i)=>{
  let url=URL.createObjectURL(v.blob);
  let media=v.type=="image"?`<img src="${url}">`:`<video id="vid${i}" src="${url}" loop playsinline autoplay muted></video><button class="mute" data-i="${i}">🔇</button>`;
  return `<section class="post"><div class="stage" data-i="${i}">${media}</div><div class="info"><h3>${v.title}</h3><small>@SoomaaLink · ${v.cat} - Taabo si cod u furto 🔊</small></div><div class="side"><div><button>+</button><small>Follow</small></div><div><button>♥</button><small>Like</small></div><div><button>↗</button><small>Share</small></div></div></section>`
 }).join("");
 $("st").textContent=VIDEOS.length+" muuqaal";
 document.querySelectorAll(".stage").forEach(st=>{
  st.onclick=e=>{
   if(e.target.closest(".side")||e.target.closest(".mute"))return;
   let idx=st.dataset.i;let vid=document.getElementById("vid"+idx);
   if(!vid)return;if(vid.paused){vid.play()}else{vid.muted=!vid.muted;vid.volume=1;let btn=document.querySelector(`.mute[data-i="${idx}"]`);if(btn)btn.textContent=vid.muted?"🔇":"🔊"}
  }
 });
 document.querySelectorAll(".mute").forEach(btn=>{
  btn.onclick=e=>{e.stopPropagation();let idx=btn.dataset.i;let vid=document.getElementById("vid"+idx);if(vid){vid.muted=!vid.muted;vid.volume=1;vid.play();btn.textContent=vid.muted?"🔇":"🔊"}}
 });
}
function drawDiscover(){const CATS=["Dhammaan","Dabeecadda","Hees","Wararka","Qosol","Quraan"];let cat="Dhammaan";$("chips").innerHTML=CATS.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join("");let list=VIDEOS;function renderGrid(f){$("grid").innerHTML=f.map(v=>{let url=URL.createObjectURL(v.blob);let m=v.type=="image"?`<img src="${url}">`:`<video src="${url}" muted></video>`;return `<div class="tile">${m}<p>${v.title}</p></div>`}).join("")}renderGrid(list);$("chips").onclick=e=>{let c=e.target.dataset.c;if(!c)return;cat=c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.c===c));let filtered=cat==="Dhammaan"?VIDEOS:VIDEOS.filter(v=>v.cat===cat);renderGrid(filtered)}}
async function init(){await openDB();VIDEOS=await getAll();VIDEOS=VIDEOS.reverse();renderFeed();drawDiscover()}init();
function show(p){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id==="p-"+p));document.querySelectorAll(".nav button[data-p]").forEach(b=>b.classList.toggle("on",b.dataset.p===p))}
document.querySelectorAll(".nav button[data-p]").forEach(b=>b.onclick=()=>show(b.dataset.p));
$("midpost").onclick=()=>{$("postm").hidden=false};$("pclose").onclick=()=>{$("postm").hidden=true;status.style.display="none"};
$("psave").onclick=async()=>{let file=$("pfile").files[0];if(!file){alert("Fadlan dooro file");return}let btn=$("psave");btn.disabled=true;btn.textContent="Wuu kaydinayaa...";status.style.display="block";status.textContent="⏳ "+file.name;try{let title=$("pt").value.trim()||file.name;let cat=$("pc").value;let type=file.type.startsWith("image")?"image":"video";await addVideo({blob:file,title,cat,type,date:Date.now()});status.textContent="✅ Kaydsamay!";VIDEOS=await getAll();VIDEOS=VIDEOS.reverse();renderFeed();drawDiscover();setTimeout(()=>{$("postm").hidden=true;status.style.display="none";btn.disabled=false;btn.textContent="Ku dar";$("pfile").value="";$("pt").value="";show("home")},600)}catch(e){status.textContent="❌ "+e.message;btn.disabled=false;btn.textContent="Ku dar"}};
$("del").onclick=async()=>{if(confirm("Tirtir?")){await clearAll();VIDEOS=[];renderFeed();drawDiscover()}};
</script></body></html><!DOCTYPE html>

<head>
<meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}

.header{position:fixed;top:0;left:0;right:0;height:54px;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:20;border-bottom:1px solid #111}
.header b{font-size:1.1rem}.header small{color:#0f0;font-size:.75rem}
.nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav button{background:none;border:0;color:#8a8a8a;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px}
.nav button span{font-size:1.4rem}.nav button.on{color:#fff}.nav button.mid{background:#fe2c55;color:#fff;border-radius:50%;width:54px;height:54px;justify-content:center}
.page{position:fixed;top:54px;bottom:66px;left:0;right:0;display:none;overflow-y:auto;background:#000}
.page.on{display:block}
#feed{scroll-snap-type:y mandatory;height:100%;overflow-y:auto}
.post{height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:100%;height:100%;position:relative;background:#000}
.stage video,.stage img{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;left:12px;bottom:12px;right:88px;z-index:10;text-shadow:0 1px 6px #000}
.overlay h3{font-size:.95rem;margin-bottom:4px}.overlay p{font-size:.78rem;color:#ddd}
.actions{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:11}
.act{display:flex;flex-direction:column;align-items:center}
.act button{width:54px;height:54px;border-radius:50%;border:0;background:rgba(70,70,70,.85);color:#fff;font-size:1.5rem}
.act button.on{background:#fe2c55;color:#fff}
.act small{font-size:.68rem;margin-top:4px;text-align:center}
.mute{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.1rem;z-index:12}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.center{align-items:center;padding:16px}
.modal[hidden]{display:none!important}
.mbox{width:100%;max-width:420px;background:#111;border-radius:18px 18px 0 0;padding:18px;max-height:85vh;overflow-y:auto}
.mbox.center{border-radius:18px}
.mbox input,.mbox textarea{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #333;background:#000;color:#fff}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#fe2c55;color:#fff;font-weight:700;margin-bottom:8px}
.btn.blue{background:#2563eb}.btn.gray{background:#222}.btn:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#000;color:#fff}.tabs button.on{background:#fff;color:#000}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px}.chip{flex:none;border:1px solid #333;background:none;color:#fff;padding:8px 16px;border-radius:99px}.chip.on{background:#2563eb;border-color:#2563eb}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 20px}.tile{border-radius:12px;overflow:hidden;background:#111;border:0;color:#fff;text-align:left}.tile video,.tile img{width:100%;aspect-ratio:9/12;object-fit:cover;display:block}.tile p{padding:8px;font-size:.8rem}
.list{padding:12px}.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #111}.avatar{width:42px;height:42px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:700}
.cmt{padding:10px 0;border-bottom:1px solid #1a1a1a}.cmt b{font-size:.85rem}.cmt p{font-size:.85rem;color:#ccc;margin-top:2px}
.stat{display:flex;justify-content:space-around;padding:16px 0;text-align:center;border-bottom:1px solid #111}.stat b{display:block;font-size:1.1rem}
</style>
</head>
<body>
<div class="header"><b>SoomaaLink</b><small id="userLabel"></small></div>

<div class="page on" id="p-home"><div id="feed"></div></div>
<div class="page" id="p-discover"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></div>
<div class="page" id="p-inbox"><div class="list" id="inboxList"></div></div>
<div class="page" id="p-profile"><div id="profileBox"></div></div>

<!-- AUTH MODAL -->
<div class="modal center" id="authM"><div class="mbox center"><h2 id="authTitle">Soo Gal</h2><div class="tabs"><button class="on" id="tabLogin" onclick="setAuth('login')">Login</button><button id="tabSignup" onclick="setAuth('signup')">Sign Up</button></div><input id="au_user" placeholder="Magaca (username)"><input id="au_pass" type="password" placeholder="Password"><button class="btn" id="authBtn" onclick="doAuth()">Login</button><p style="font-size:.7rem;color:#888;text-align:center;margin-top:8px">Local account - telefoonkaaga ku kaydsan</p></div></div>

<!-- POST MODAL -->
<div class="modal center" id="postM" hidden><div class="mbox center"><h2>Ku dar muuqaal</h2><input type="file" id="pfile" accept="video/*,image/*"><input id="ptitle" placeholder="Magac"><select id="pcat" style="width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #333;background:#000;color:#fff"><option>Dabeecadda</option><option>Hees</option><option>Qosol</option><option>Wararka</option><option>Quraan</option></select><button class="btn" id="psave">Ku dar</button><button class="btn gray" onclick="closeM('postM')">Xidh</button></div></div>

<!-- COMMENT MODAL -->
<div class="modal" id="cmtM" hidden><div class="mbox"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3>Comments</h3><button class="btn gray" style="width:auto;padding:6px 12px" onclick="closeM('cmtM')">X</button></div><div id="cmtList" style="max-height:50vh;overflow-y:auto"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="cmtInput" placeholder="Qor comment..." style="flex:1"><button class="btn blue" style="width:auto;padding:12px 18px" onclick="addComment()">Dir</button></div></div></div>

<div class="nav">
<button data-p="home" class="on" onclick="showP('home')"><span>🏠</span>Home</button>
<button data-p="discover" onclick="showP('discover')"><span>🔍</span>Discover</button>
<button class="mid" onclick="openM('postM')"><span>＋</span></button>
<button data-p="inbox" onclick="showP('inbox')"><span>💬</span>Inbox</button>
<button data-p="profile" onclick="showP('profile')"><span>👤</span>Profile</button>
</div>

<script>
let db, VIDEOS=[], CUR_USER=null, AUTH_MODE='login', CUR_CMT_ID=null;
let likes=JSON.parse(localStorage.getItem('sl_likes')||'{}');
let follows=JSON.parse(localStorage.getItem('sl_follows')||'{}');
let comments=JSON.parse(localStorage.getItem('sl_comments')||'{}');
let users=JSON.parse(localStorage.getItem('sl_users')||'{}');
let inbox=JSON.parse(localStorage.getItem('sl_inbox')||'[]');

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('sl_db',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('vids',{keyPath:'id',autoIncrement:true});r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function getAll(){return new Promise((res,rej)=>{let tx=db.transaction('vids','readonly');let rq=tx.objectStore('vids').getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=rej})}
function addVid(o){return new Promise((res,rej)=>{let tx=db.transaction('vids','readwrite');let rq=tx.objectStore('vids').add(o);rq.onsuccess=()=>res(rq.result);rq.onerror=rej})}
function clearVids(){return new Promise(r=>{let tx=db.transaction('vids','readwrite');tx.objectStore('vids').clear().onsuccess=r})}

const $=id=>document.getElementById(id);
function save(){localStorage.setItem('sl_likes',JSON.stringify(likes));localStorage.setItem('sl_follows',JSON.stringify(follows));localStorage.setItem('sl_comments',JSON.stringify(comments));localStorage.setItem('sl_inbox',JSON.stringify(inbox));localStorage.setItem('sl_users',JSON.stringify(users))}
function openM(id){$(id).hidden=false} function closeM(id){$(id).hidden=true}
function showP(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));document.querySelectorAll('.nav button[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); if(p==='profile')renderProfile(); if(p==='inbox')renderInbox(); if(p==='discover')renderDiscover()}

function setAuth(m){AUTH_MODE=m; $('tabLogin').classList.toggle('on',m==='login'); $('tabSignup').classList.toggle('on',m==='signup'); $('authTitle').textContent=m==='login'?'Soo Gal':'Is Diiwaan Geli'; $('authBtn').textContent=m==='login'?'Login':'Sign Up'}
function doAuth(){
 let u=$('au_user').value.trim(); let pw=$('au_pass').value.trim();
 if(!u||!pw){alert('Magac iyo password qor');return}
 if(AUTH_MODE==='signup'){ if(users[u]){alert('Magacani wuu jiraa');return} users[u]={pass:pw, followers:0, following:0}; }
 else { if(!users[u]||users[u].pass!==pw){alert('Login khalad');return} }
 CUR_USER=u; localStorage.setItem('sl_cur',u); save(); checkAuth();
}
function checkAuth(){ CUR_USER=localStorage.getItem('sl_cur'); if(!CUR_USER){ $('authM').hidden=false } else { $('authM').hidden=true; $('userLabel').textContent='@'+CUR_USER } }
function logout(){localStorage.removeItem('sl_cur'); location.reload()}

function renderFeed(){
 let feed=$('feed');
 if(VIDEOS.length===0){ feed.innerHTML=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888;padding:20px;text-align:center"><div style="font-size:3rem">📸</div><h3>Weli muuqaal ma jiro</h3><p>+ taabo si aad u soo darto</p></div>`; return }
 feed.innerHTML=VIDEOS.map((v,i)=>{
  let url=URL.createObjectURL(v.blob);
  let isLiked=likes[v.id]; let isFollowed=follows[v.userId||v.id];
  let cCount=(comments[v.id]||[]).length;
  let media=v.type==='image'?`<img src="${url}">`:`<video id="vid${v.id}" src="${url}" loop playsinline autoplay muted></video><button class="mute" onclick="toggleMute(${v.id})" id="mute${v.id}">🔇</button>`;
  return `<section class="post"><div class="stage" onclick="if(event.target.tagName!=='BUTTON') toggleMute(${v.id})">${media}</div>
  <div class="overlay"><h3>${v.title}</h3><p>@${v.owner||'SoomaaLink'} · ${v.cat} · Taabo codka 🔊</p></div>
  <div class="actions">
   <div class="act"><button class="${isFollowed?'on':''}" onclick="toggleFollow(${v.id},'${v.owner||'SoomaaLink'}')">${isFollowed?'✓':'+'}</button><small>${isFollowed?'Following':'Follow'}</small></div>
   <div class="act"><button class="${isLiked?'on':''}" onclick="toggleLike(${v.id})">♥</button><small>${(v.likeCount||0)+(isLiked?1:0)} Like</small></div>
   <div class="act"><button onclick="openComments(${v.id})">💬</button><small>${cCount} Comment</small></div>
   <div class="act"><button onclick="doShare(${v.id},'${v.title.replace(/'/g,'')}')">↗</button><small>Share</small></div>
  </div></section>`
 }).join('');
}

function toggleMute(id){let vid=$('vid'+id);let btn=$('mute'+id);if(!vid)return;vid.muted=!vid.muted;vid.volume=1;if(!vid.muted)vid.play();if(btn)btn.textContent=vid.muted?'🔇':'🔊'}
function toggleLike(id){
 likes[id]=!likes[id]; save(); renderFeed();
 if(likes[id]){ inbox.unshift({type:'like',txt:CUR_USER+' liked your video',time:Date.now()}); save() }
}
function toggleFollow(id,owner){
 follows[id]=!follows[id]; save(); renderFeed();
 if(follows[id]){ inbox.unshift({type:'follow',txt:CUR_USER+' started following you',time:Date.now()}); save() }
}
function doShare(id,title){
 if(navigator.share){ navigator.share({title:title, text:'Ka daawo SoomaaLink', url:location.href}) }
 else { navigator.clipboard.writeText(location.href); alert('Link copied! '+title) }
 inbox.unshift({type:'share',txt:CUR_USER+' shared '+title,time:Date.now()}); save();
}
function openComments(id){ CUR_CMT_ID=id; $('cmtM').hidden=false; renderCmt()}
function renderCmt(){
 let list=comments[CUR_CMT_ID]||[]; $('cmtList').innerHTML=list.length?list.map(c=>`<div class="cmt"><b>@${c.user}</b><p>${c.text}</p><small style="color:#666">${new Date(c.time).toLocaleString()}</small></div>`).join(''):`<p style="color:#666;text-align:center;padding:20px">Weli comment ma jiro - noqo kan ugu horeeya!</p>`;
}
function addComment(){
 let txt=$('cmtInput').value.trim(); if(!txt)return;
 if(!comments[CUR_CMT_ID])comments[CUR_CMT_ID]=[];
 comments[CUR_CMT_ID].push({user:CUR_USER,text:txt,time:Date.now()}); save(); $('cmtInput').value=''; renderCmt(); renderFeed();
 inbox.unshift({type:'comment',txt:CUR_USER+' commented: '+txt.slice(0,20),time:Date.now()}); save();
}
function renderInbox(){
 $('inboxList').innerHTML=inbox.length?inbox.map(i=>`<div class="item"><div class="avatar">${i.type==='like'?'♥':i.type==='follow'?'+':'💬'}</div><div><b>${i.txt}</b><br><small style="color:#888">${new Date(i.time).toLocaleString()}</small></div></div>`).join(''):`<p style="color:#888;text-align:center;padding:40px">Inbox madhan</p>`;
}
function renderDiscover(){
 const CATS=['Dhammaan','Dabeecadda','Hees','Wararka','Qosol','Quraan']; let cat='Dhammaan';
 $('chips').innerHTML=CATS.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 function draw(f){ $('grid').innerHTML=f.map(v=>{let url=URL.createObjectURL(v.blob);let m=v.type==='image'?`<img src="${url}">`:`<video src="${url}" muted></video>`;return `<button class="tile" onclick="showP('home')">${m}<p>${v.title}</p></button>`}).join('')}
 draw(VIDEOS);
 $('chips').onclick=e=>{let c=e.target.dataset.c;if(!c)return;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.c===c));let fil=c==='Dhammaan'?VIDEOS:VIDEOS.filter(v=>v.cat===c);draw(fil)}
}
function renderProfile(){
 let myVids=VIDEOS.filter(v=>v.owner===CUR_USER);
 let followersCount=Object.keys(follows).length;
 $('profileBox').innerHTML=`<div class="list"><div style="text-align:center;padding:20px"><div class="avatar" style="width:70px;height:70px;font-size:1.5rem;margin:auto">${CUR_USER[0].toUpperCase()}</div><h2 style="margin-top:10px">@${CUR_USER}</h2></div>
 <div class="stat"><div><b>${myVids.length}</b><small>Videos</small></div><div><b>${followersCount}</b><small>Followers</small></div><div><b>${Object.keys(likes).length}</b><small>Likes</small></div></div>
 <div style="padding:12px"><button class="btn gray" onclick="logout()">Log Out</button><button class="btn gray" onclick="if(confirm('Tirtir dhammaan?')){clearVids().then(()=>location.reload())}">Tirtir Videos</button></div>
 <div class="grid">${myVids.map(v=>{let url=URL.createObjectURL(v.blob);let m=v.type==='image'?`<img src="${url}">`:`<video src="${url}" muted></video>`;return `<div class="tile">${m}<p>${v.title}</p></div>`}).join('')}</div></div>`;
}

async function init(){ await openDB(); let all=await getAll(); VIDEOS=all.reverse(); checkAuth(); renderFeed(); renderDiscover(); renderInbox(); renderProfile(); } init();

$('psave').onclick=async()=>{
 let file=$('pfile').files[0]; if(!file){alert('Dooro file');return}
 let btn=$('psave'); btn.disabled=true; btn.textContent='Kaydinaya...';
 try{ let title=$('ptitle').value.trim()||file.name; let cat=$('pcat').value; let type=file.type.startsWith('image')?'image':'video';
  await addVid({blob:file,title,cat,type,owner:CUR_USER,likeCount:0,date:Date.now()});
  let all=await getAll(); VIDEOS=all.reverse(); renderFeed(); renderDiscover(); renderProfile(); closeM('postM'); $('pfile').value=''; $('ptitle').value=''; showP('home');
 }catch(e){alert(e.message)} btn.disabled=false; btn.textContent='Ku dar';
};
</script>
</body>
</html>
