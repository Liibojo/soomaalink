<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SoomaaLink</title>
<style>
:root{--bg:#000;--s1:#161616;--s2:#252525;--ac:#fe2c55;--ok:#25d366;--tx:#fff;--mu:#9a9a9a;--bd:#2a2a2a}
body.light{--bg:#f6f6f6;--s1:#fff;--s2:#ebebeb;--tx:#111;--mu:#666;--bd:#ddd}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0 0 calc(58px + env(safe-area-inset-bottom)) 0;overflow-y:auto;display:none;background:var(--bg);-webkit-overflow-scrolling:touch}
.page.on{display:block}
#home{background:#000;overflow:hidden}
.pad{padding:14px}
/* NAV */
.nav{position:absolute;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#000;border-top:1px solid #222;display:flex;align-items:center;justify-content:space-around;z-index:60;color:#fff}
body.light .nav.lt{background:#fff;color:#111;border-color:#ddd}
.ni{display:flex;flex-direction:column;align-items:center;font-size:10px;opacity:.6;position:relative;min-width:54px;gap:1px}
.ni span:first-child{font-size:21px}.ni.on{opacity:1;font-weight:700}
.plus{width:46px;height:32px;border-radius:9px;background:#fff;color:#000;font-size:24px;font-weight:700;position:relative;line-height:30px}
.plus:before,.plus:after{content:"";position:absolute;top:0;bottom:0;width:8px;border-radius:9px}
.plus:before{left:-4px;background:#25f4ee;z-index:-1}.plus:after{right:-4px;background:var(--ac);z-index:-1}
.dot{position:absolute;top:0;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;font-style:normal}
/* HOME TOP */
.htop{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 18px;background:linear-gradient(#0008,transparent);color:#fff}
.htabs{display:flex;gap:18px;font-weight:700;font-size:16px}
.htabs button{opacity:.6;padding:4px 2px;border-bottom:2px solid transparent}
.htabs button.on{opacity:1;border-color:#fff}
.tb{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#0005}
.livebtn{background:var(--ac);font-size:11px;font-weight:800;border-radius:6px;padding:5px 9px;letter-spacing:.5px;color:#fff}
/* FEED */
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#000;color:#fff}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgdemo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:hue 8s linear infinite alternate}
.bgdemo .em{font-size:110px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) scale(1.06)}}
@keyframes hue{to{filter:hue-rotate(40deg) brightness(1.1)}}
.shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,#000b);pointer-events:none}
.tap{position:absolute;inset:0;z-index:2}
.pp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);font-size:70px;opacity:0;z-index:3;pointer-events:none;transition:.2s}
.pp.on{opacity:.85;transform:translate(-50%,-50%) scale(1)}
.heart{position:absolute;font-size:80px;z-index:5;pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg);opacity:1}50%{transform:translate(-50%,-70%) scale(1.2) rotate(8deg);opacity:1}100%{transform:translate(-50%,-140%) scale(1) rotate(0);opacity:0}}
.rail{position:absolute;right:8px;bottom:84px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:15px}
.rb{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;text-shadow:0 1px 4px #0008;gap:2px}
.rb i{font-style:normal;font-size:31px;line-height:1;filter:drop-shadow(0 1px 3px #0007)}
.rb.on i{color:var(--ac)}.rb.sv.on i{color:#ffc928}
.avw{position:relative;margin-bottom:8px}
.avc{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,var(--ac),#ff9a3c);display:flex;align-items:center;justify-content:center;font-size:22px}
.fp{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.disc{width:42px;height:42px;border-radius:50%;background:conic-gradient(#222,#555,#222,#555,#222);border:8px solid #111;display:flex;align-items:center;justify-content:center;animation:spin 5s linear infinite}
.disc.pause{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.rinfo{position:absolute;left:12px;right:84px;bottom:18px;z-index:6;text-shadow:0 1px 4px #0009}
.rinfo .u{font-weight:800;font-size:16px;margin-bottom:5px}
.rinfo .cap{font-size:14px;line-height:1.4;margin-bottom:7px;max-height:84px;overflow:hidden}
.rinfo .cap a{font-weight:700}
.rinfo .mu{font-size:13px;display:flex;gap:8px;align-items:center}
.safe{background:var(--ok);font-size:10px;font-weight:800;border-radius:9px;padding:2px 8px;text-shadow:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff3;z-index:7}
.bar div{height:100%;width:0;background:#fff}
.empty{text-align:center;color:var(--mu);padding:60px 24px;font-size:14px;line-height:1.7}
.empty b{display:block;font-size:48px;margin-bottom:8px}
#home .empty{color:#bbb;height:100%;display:flex;flex-direction:column;justify-content:center}
/* GENERIC UI */
.h{font-size:20px;font-weight:800;margin-bottom:12px}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:13px 18px;font-weight:700;width:100%}
.btn.sm{width:auto;padding:10px 18px}.btn.g{background:var(--s2);color:var(--tx)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 15px;border-radius:20px;background:var(--s2);color:var(--mu);font-size:13px}
.chip.on{background:var(--ac);color:#fff}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tl{aspect-ratio:3/4;background:var(--s2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;border-radius:4px;color:#fff}
.tl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl .bgd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tl span{position:absolute;bottom:4px;left:6px;font-size:11px;font-weight:700;text-shadow:0 1px 3px #000}
.sec{font-weight:800;margin:16px 0 8px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:var(--s2);border-radius:18px;padding:6px 13px;font-size:13px;font-weight:600}
.usr{display:flex;align-items:center;gap:10px;padding:8px 0}
.usr .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#ff9a3c);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.usr .nm{flex:1;font-weight:700;font-size:14px;min-width:0}
.usr small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.fl{font-size:13px;font-weight:700;background:var(--ac);color:#fff;border-radius:8px;padding:7px 16px}
.fl.on{background:var(--s2);color:var(--tx)}
.stabs{display:flex;border-bottom:1px solid var(--bd);margin:14px 0 6px}
.stabs button{flex:1;padding:11px;color:var(--mu);font-weight:700;border-bottom:2px solid transparent}
.stabs button.on{color:var(--tx);border-color:var(--tx)}
.prof{text-align:center;padding-top:6px}
.pav{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#ff9a3c);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 8px}
.stats{display:flex;justify-content:center;gap:28px;margin:14px 0}
.stats b{display:block;font-size:18px}.stats small{color:var(--mu);font-size:12px}
.bio{color:var(--mu);font-size:14px;margin:8px 20px 14px;line-height:1.5}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ic{width:40px;height:40px;border-radius:50%;background:var(--s2);font-size:18px;display:flex;align-items:center;justify-content:center}
.drop{border-radius:18px;background:var(--s1);border:1px solid var(--bd);padding:26px 16px;text-align:center;margin-bottom:12px;cursor:pointer}
.drop b{display:block;font-size:42px;margin-bottom:6px}.drop small{color:var(--mu)}
.lbl{font-size:12px;color:var(--mu);margin:12px 0 6px;display:block}
.pb{height:7px;background:var(--s2);border-radius:4px;overflow:hidden;margin:6px 0}
.pb div{height:100%;width:0;background:var(--ac);transition:width .15s}
.nt{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:14px;align-items:center}
.nt.un{font-weight:700}.nt small{display:block;color:var(--mu);font-weight:400;font-size:12px;margin-top:2px}
.nt .ico{width:40px;height:40px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.th{display:flex;gap:11px;padding:12px 0;align-items:center;cursor:pointer}
.th .m{flex:1;min-width:0;font-weight:700;font-size:14px}
.th small{display:block;color:var(--mu);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;margin-bottom:8px;font-size:14px;line-height:1.35}
.msg.me{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.o{background:var(--s2);border-bottom-left-radius:4px}
/* SHEETS */
.ov{display:none;position:absolute;inset:0;background:#0009;z-index:100;align-items:flex-end}
.ov.on{display:flex}
.sheet{background:var(--s1);color:var(--tx);width:100%;border-radius:20px 20px 0 0;padding:16px;max-height:80%;overflow:auto;animation:up .22s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh{font-weight:800;font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.so{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mu)}
.so i{font-style:normal;width:52px;height:52px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:24px}
.cm{display:flex;gap:10px;margin-bottom:14px;font-size:14px}
.cm .a{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#ff9a3c);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cm .b{flex:1;min-width:0}.cm small{color:var(--mu);font-size:12px}
.cm .lk{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mu)}.cm .lk.on{color:var(--ac)}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--bd);font-size:15px;width:100%;text-align:left}
.full{position:absolute;inset:0;background:#000;z-index:150;display:none;color:#fff}
.full.on{display:block}
.full video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftop{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px;display:flex;justify-content:space-between;align-items:center;z-index:3;background:linear-gradient(#0008,transparent)}
.fbot{position:absolute;bottom:0;left:0;right:0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));z-index:3;background:linear-gradient(transparent,#000a)}
.recb{width:76px;height:76px;border-radius:50%;border:5px solid #fff;display:flex;align-items:center;justify-content:center;margin:0 auto}
.recb i{width:56px;height:56px;border-radius:50%;background:var(--ac);transition:.2s}
.recb.on i{width:30px;height:30px;border-radius:8px}
.lchat{max-height:34vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:10px;font-size:14px;text-shadow:0 1px 3px #000}
.lchat div{margin-top:4px}
.toast{position:absolute;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:#333;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.about p{color:var(--mu);line-height:1.7;margin-bottom:12px;font-size:14px}
.box{background:var(--s2);border-left:4px solid var(--ok);border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px}.box b{display:block;margin-bottom:3px}
.fh{position:absolute;font-size:34px;z-index:4;animation:fl 2.2s ease-out forwards;pointer-events:none}
.tdel{position:absolute;top:5px;right:5px;z-index:3;width:32px;height:32px;border-radius:50%;background:#000a;font-size:16px;display:flex;align-items:center;justify-content:center}
@keyframes fl{to{transform:translateY(-300px);opacity:0}}
.full canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#lsSetup{position:absolute;inset:0;display:none;flex-direction:column;justify-content:flex-end;z-index:4}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;padding:0 10px 16px;color:#fff;text-shadow:0 1px 4px #000}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.tool i{font-style:normal;font-size:28px}
.setbox{background:#000b;border-radius:20px 20px 0 0;padding:14px 14px calc(12px + env(safe-area-inset-bottom))}
.setbox input,.setbox select{background:#fff2;border-color:#fff3;color:#fff}
.setbox select option{color:#000}
.bigb{background:var(--ac);color:#fff;border-radius:30px;padding:15px;font-size:18px;font-weight:800;width:100%;margin-top:12px}
.modes{display:flex;justify-content:center;gap:28px;margin-top:12px;font-weight:700;font-size:15px}
.modes button{opacity:.5;color:#fff}.modes button.on{opacity:1}
#lvCd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:130px;font-weight:800;z-index:6;background:#0006;color:#fff}
.lmeta{position:absolute;top:calc(62px + env(safe-area-inset-top));left:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lchip{background:#0009;border-radius:12px;padding:8px 12px;font-size:13px;color:#fff;max-width:100%;line-height:1.4}
.lchip a{text-decoration:underline}
.gbar{height:6px;background:#fff3;border-radius:3px;margin-top:5px;overflow:hidden;min-width:180px}.gbar div{height:100%;background:var(--ac);width:0}
.pv{display:block;width:100%;text-align:left;background:#fff2;border-radius:8px;padding:8px 10px;margin-top:5px;color:#fff}
.pr{position:relative;display:flex;justify-content:space-between;gap:12px;margin-top:5px;padding:7px 10px;border-radius:8px;background:#fff1;overflow:hidden;z-index:0}
.pr i{position:absolute;left:0;top:0;bottom:0;background:#fe2c5588;z-index:-1}
:root{--sbg:#0b0b0b;--scd:#1c1c1c}body.light{--sbg:#f5f5f5;--scd:#fff}
#setPage{position:absolute;inset:0;z-index:90;background:var(--sbg);color:var(--tx);display:none;flex-direction:column}
#setPage.on{display:flex}
.sph{display:flex;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;font-weight:800;font-size:17px}
.sph button{width:42px;height:42px;font-size:30px;line-height:1}
.sph span{flex:1;text-align:center;margin-right:42px}
#setBody{flex:1;overflow-y:auto;padding:0 12px 40px;-webkit-overflow-scrolling:touch}
#setBody input{margin-top:8px}
.sgt{color:var(--mu);font-size:13px;font-weight:600;margin:20px 6px 8px}
.sg{background:var(--scd);border-radius:16px;overflow:hidden}
.sr{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;font-size:16px;font-weight:600;min-height:56px}
.sr+.sr{border-top:1px solid var(--bd)}
.si{font-size:20px;width:26px;text-align:center;opacity:.75;flex-shrink:0}
.sl{flex:1;min-width:0}
.sv{color:var(--mu);font-weight:400;font-size:15px;white-space:nowrap}
.sc{color:var(--mu);font-size:22px}
.sw{position:relative;width:46px;height:28px;flex-shrink:0}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:pointer;padding:0;margin:0}
.sw i{position:absolute;inset:0;background:#8886;border-radius:14px;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i:after{transform:translateX(18px)}
.sub{color:var(--mu);font-size:13px;margin:10px 6px;line-height:1.55}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stat2 div{background:var(--scd);border-radius:14px;padding:16px;text-align:center}
.stat2 b{display:block;font-size:24px}.stat2 small{color:var(--mu)}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--mu);flex-shrink:0}
.sr.sel .rd{border:7px solid var(--ac)}
.faq{padding:15px 16px}.faq+.faq{border-top:1px solid var(--bd)}.faq b{display:block;margin-bottom:6px}.faq p{color:var(--mu);font-size:14px;line-height:1.6}
.sws{display:flex;gap:14px;flex-wrap:wrap;padding:16px}
.swc{width:48px;height:48px;border-radius:50%;border:4px solid transparent}.swc.on{border-color:var(--tx)}
body.reduce *{animation:none!important;transition:none!important}
body.big .cap{font-size:17px}body.big .sl{font-size:18px}body.big .cm,body.big .msg{font-size:16px}
body.hc{--mu:#d0d0d0;--bd:#777}body.light.hc{--mu:#333;--bd:#888}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="home" class="page on">
  <div class="htop">
    <button class="livebtn" onclick="openLiveMenu()">● LIVE</button>
    <div class="htabs"><button id="tFol" onclick="setFeed('following')"></button><button id="tFyp" class="on" onclick="setFeed('foryou')"></button></div>
    <div class="row" style="gap:6px"><button class="tb" id="muteB" onclick="toggleMute()">🔊</button><button class="tb" onclick="go('discover')">🔍</button></div>
  </div>
  <div class="feed" id="feed"></div>
</div>

<!-- DISCOVER -->
<div id="discover" class="page"><div class="pad">
  <input id="q" type="search" oninput="renderDiscover()">
  <div class="chips" id="dChips" style="margin-top:10px"></div>
  <div class="sec" data-i="trendTags"></div><div class="tags" id="dTags"></div>
  <div class="sec" data-i="trending"></div><div class="tg" id="dGrid"></div>
  <div class="sec" data-i="creators"></div><div id="dUsers"></div>
</div></div>

<!-- UPLOAD -->
<div id="upload" class="page"><div class="pad">
  <div class="h" data-i="newVideo"></div>
  <div id="upStart">
    <div class="drop" onclick="openCam()"><b>📹</b><div style="font-weight:700" data-i="record"></div><small data-i="recSub"></small></div>
    <div class="drop" onclick="$('file').click()"><b>🖼️</b><div style="font-weight:700" data-i="gallery"></div><small data-i="galSub"></small></div>
  </div>
  <input type="file" id="file" accept="video/*" hidden onchange="fileChosen(this.files[0])">
  <input type="file" id="fileCam" accept="video/*" capture hidden onchange="fileChosen(this.files[0])">
  <div id="upForm" style="display:none">

async function doUpload(){
  if(uploading)return;if(!fileObj){toast(T('pickFirst'));return}
  uploading=true;$('upBtn').disabled=true;$('upProg').style.display='block';
  const setP=p=>{$('upFill').style.width=p+'%';$('upPct').textContent=Math.round(p)+'%'};
  try{
    const size=fileObj.size,ch=1024*1024;let off=0;
    while(off<size){await fileObj.slice(off,off+ch).arrayBuffer();off+=ch;setP(Math.min(off/size,1)*90)}
    const id='v'+Date.now();await idb('put',id,fileObj);setP(100);
    S.videos.unshift({id,caption:$('uCap').value.trim()||'🎬',cat:$('uCat').value,owner:S.me.handle,music:$('uMus').value.trim()||S.set.defMusic||'Original sound',audience:S.set.audience,likes:0,liked:false,saved:false,comments:[],shares:0,views:0,demo:false,ts:Date.now()});

function toggleRec(){
  if(rec.mr&&rec.mr.state==='recording'){rec.mr.stop();return}
  const types=['video/webm;codecs=vp9,opus','video/webm','video/mp4'];
  const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  try{rec.mr=new MediaRecorder(rec.stream,mime?{mimeType:mime}:undefined)}catch(e){toast(T('camErr'));return}

    const type=rec.mr.mimeType||mime||'video/webm',ext=type.includes('mp4')?'mp4':'webm';

}

/* ---- canvas pipeline: camera -> filters -> canvas -> stream ---- */
function lvFilter(){const f=((ENH[LV.o.enh]||'')+' '+(FX[LV.o.fx]||'')).trim();return f||'none'}
function lvDraw(){
  const c=LV.ctx,W=540,H=960;if(!c)return;
  c.save();
  if(LV.o.mode==='cam'&&LV.src&&LV.src.readyState>=2&&LV.src.videoWidth){
    c.filter=lvFilter();
    const sw=LV.src.videoWidth,sh=LV.src.videoHeight,sc=Math.max(W/sw,H/sh),dw=sw*sc,dh=sh*sc;
    c.drawImage(LV.src,(W-dw)/2,(H-dh)/2,dw,dh);
  }else{
    c.filter='none';const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1a0533');g.addColorStop(1,'#fe2c55');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.font='140px serif';c.fillText('🎙️',W/2,H/2-40);c.font='bold 38px sans-serif';c.fillText('@'+S.me.handle,W/2,H/2+90);
  }
  c.filter='none';
  if(LV.gv&&LV.gv.readyState>=2&&LV.gv.videoWidth){
    const pw=170,ph=240,x=W-pw-16,y=100;c.fillStyle='#fff';c.fillRect(x-3,y-3,pw+6,ph+6);
    const sw=LV.gv.videoWidth,sh=LV.gv.videoHeight,sc=Math.max(pw/sw,ph/sh);
    c.save();c.beginPath();c.rect(x,y,pw,ph);c.clip();c.drawImage(LV.gv,x+(pw-sw*sc)/2,y+(ph-sh*sc)/2,sw*sc,sh*sc);c.restore();
  }
  c.restore();
}

async function lvCapture(){
  let raw;
  try{raw=await gum({audio:{echoCancellation:true,noiseSuppression:true},video:vidC(LV.o.facing)});LV.o.mode='cam'}
  catch(e){try{raw=await gum({audio:true,video:false});LV.o.mode='voice';toast(B('Kamarada ma furmin, Voice chat ayaa la bilaabay','Camera unavailable, starting voice chat'))}catch(e2){return false}}
  LV.raw=raw;
  LV.ac=new (window.AudioContext||window.webkitAudioContext)();LV.ac.resume();
  LV.dest=LV.ac.createMediaStreamDestination();LV.micGain=LV.ac.createGain();LV.micGain.gain.value=1;
  LV.ac.createMediaStreamSource(new MediaStream(raw.getAudioTracks())).connect(LV.micGain);LV.micGain.connect(LV.dest);
  LV.src=document.createElement('video');LV.src.muted=true;LV.src.playsInline=true;LV.src.autoplay=true;LV.src.style.cssText='position:fixed;left:-9999px;width:2px;height:2px';document.body.appendChild(LV.src);
  LV.vstream=new MediaStream(raw.getVideoTracks());
  if(LV.o.mode==='cam'){LV.src.srcObject=LV.vstream;LV.src.play().catch(()=>{})}
  const cv=$('liveC');LV.ctx=cv.getContext('2d');
  if(!cv.captureStream)return false;

function lvStopCapture(){

  if(LV.gv){LV.gv.srcObject=null;LV.gv.remove();LV.gv=null}

  LV.out=null;LV.ctx=null;

    });

  });

let shId=null;

function shareTo(w){
  const prof=shId==='__p',v=prof?{caption:'@'+S.me.handle}:vid(shId),url=location.href.split('#')[0],text=v.caption.slice(0,80)+' - SoomaaLink 👨‍👩‍👧‍👦',e=encodeURIComponent;
  if(!prof){v.shares=(v.shares||0)+1;save();refreshRail(shId)}if(w==='dl'){closeOv(null,'shOv');downloadVid(shId);return}
  if(w==='wa')window.open('https://wa.me/?text='+e(text+' '+url),'_blank');
  else if(w==='tg')window.open('https://t.me/share/url?url='+e(url)+'&text='+e(text),'_blank');
  else if(w==='mail')location.href='mailto:?subject='+e(text)+'&body='+e(url);
  else if(w==='native')navigator.share({title:'SoomaaLink',text,url}).catch(()=>{});
  else{(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast(T('copied'))).catch(()=>prompt('Link:',url))}

}

function renderProfile(){

  const likesTotal=vids.reduce((a,v)=>a+v.likes,0);
  const fol=S.following.includes(h);
  const followers=mine?0:Math.round(likesTotal/3);
  let list=vids;
  if(mine&&pTab==='saved')list=S.videos.filter(v=>v.saved);
  if(mine&&pTab==='liked')list=S.videos.filter(v=>v.liked);
  if(!mine)pTab='mine';
  $('pBody').innerHTML=`
   <div class="ptop">${mine?'<span></span>':`<button class="ic" onclick="openMe()">‹</button>`}<b>@${esc(h)}</b>${mine?`<button class="ic" onclick="openSettings()">⚙️</button>`:'<span style="width:40px"></span>'}</div>
   <div class="prof"><div class="pav">👤</div><div style="font-size:19px;font-weight:800">${esc(mine?S.me.name:'@'+h)}${mine&&S.set.private?' 🔒':''}</div>
    <div class="stats"><div><b>${S.following.length&&mine?S.following.length:(mine?0:fmt(Math.round(followers/4)))}</b><small>${T('following')}</small></div><div><b>${fmt(followers)}</b><small>${T('followers')}</small></div><div><b>${fmt(likesTotal)}</b><small>${T('likes')}</small></div></div>
    ${mine?`<div class="row" style="justify-content:center"><button class="btn g sm" onclick="editOpen()">${T('edit')}</button><button class="btn g sm" onclick="openShare('__p')">↗️</button></div>`
      :`<div class="row" style="justify-content:center"><button class="fl ${fol?'on':''}" style="padding:11px 30px;font-size:14px" onclick="toggleFollow('${h}')">${fol?T('followingB'):T('follow')}</button><button class="btn g sm" onclick="openChat('${h}')">${T('message')}</button><button class="btn g sm" onclick="blockUser('${h}')">🚫</button></div>`}
    <div class="bio">${esc(mine?(S.me.bio||T('bioDef')):T('bioDef'))}</div></div>

   <div class="tg">${list.length?list.map(v=>tileHTML(v,mine&&pTab==='mine')).join(''):`<div class="empty" style="grid-column:1/-1;padding:40px 10px">${pTab==='saved'?T('noSaved'):pTab==='liked'?T('noLiked'):T('noVids')}</div>`}</div>`;
  hydrate($('pBody'));

function toggleCat(c,on){const a=(S.set.hideCats||[]).filter(x=>x!==c);if(!on)a.push(c);S.set.hideCats=a;save();renderSet()}
function delVideo(id){if(!confirm(B('Tirtir video-gan?','Delete this video?')))return;S.videos=S.videos.filter(v=>v.id!==id);try{idb('del',id)}catch(e){};delete urls[id];save();if(setStack.length)renderSet();activeId=null;render();toast(B('La tirtiray','Deleted'))}
function setPin(){const p=prompt(B('Geli PIN 4 lambar ah','Enter a 4-digit PIN'));if(p===null)return;if(!/^\d{4}$/.test(p)){toast(B('PIN waa inuu noqdaa 4 lambar','PIN must be 4 digits'));return}S.set.pin=p;save();renderSet();toast(B('PIN waa la dejiyay','PIN set'))}
function removePin(){const p=prompt(B('Geli PIN-ka hadda','Enter current PIN'));if(p!==S.set.pin){if(p!==null)toast(B('PIN khalad','Wrong PIN'));return}S.set.pin='';save();renderSet()}
async function checkPerms(){
  if(!navigator.permissions){toast(B('Browser-kaagu ma muujiyo xaaladda','Your browser does not report status'));return}
  const out=[];
  for(const n of ['camera','microphone']){try{const r=await navigator.permissions.query({name:n});out.push((n==='camera'?'📷 ':'🎤 ')+r.state)}catch(e){out.push(n+': ?')}}
  toast(out.join('  ·  '));
}
async function reqPerms(){
  try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});s.getTracks().forEach(t=>t.stop());toast(B('✅ Ogolaansho waa la helay','✅ Access granted'))}catch(e){toast(T('camErr'))}
}
function saveMusic(){S.set.defMusic=$('sMus').value.trim().slice(0,60);save();toast(T('saveT'))}
function clearCache(){
  Object.values(urls).forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});for(const k in urls)delete urls[k];
  try{sessionStorage.clear()}catch(e){}
  if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
  toast(B('Cache waa la nadiifiyay','Cache cleared'));render();
}
function setThemeTo(m){S.theme=m;save();applyStatic();renderSet()}
function setLang(l){S.lang=l;save();applyStatic();render();renderSet()}
function setAccent(c){S.set.accent=c;save();applySettings();renderSet()}
function blockUser(h){if(!confirm(B('Xannib @'+h+'?','Block @'+h+'?')))return;if(!S.blocked.includes(h))S.blocked.push(h);S.following=S.following.filter(x=>x!==h);save();toast(B('La xannibay','Blocked'));openMe()}
function unblock(h){S.blocked=S.blocked.filter(x=>x!==h);save();renderSet()}
async function downloadVid(id){
  const b=await idb('get',id);if(!b){toast(B('Video lama helin','Video not found'));return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=b.name||('soomaalink-'+id+'.webm');document.body.appendChild(a);a.click();a.remove();toast(B('Waa la soo dejiyay','Downloaded'));
}
/* accounts */
function getAccts(){
  if(!S.accounts)S.accounts=[{...S.me}];
  const i=S.accounts.findIndex(a=>a.handle===S.me.handle);
  if(i<0)S.accounts.push({...S.me});else S.accounts[i]={...S.me};
  return S.accounts;
}
function accountsHTML(){
  const A=getAccts();
  return sG('',A.map((a,i)=>`<button class="sr ${a.handle===S.me.handle&&!S.loggedOut?'sel':''}" onclick="switchTo(${i})"><span class="si">👤</span><span class="sl">${esc(a.name)}<small style="display:block;color:var(--mu);font-weight:400">@${esc(a.handle)}</small></span><span class="rd"></span></button>`).join(''))
   +`<div class="sgt">${B('Ku dar akoon','Add account')}</div><input id="newAcc" maxlength="30" placeholder="${B('Magaca','Name')}"><button class="btn" style="margin-top:10px" onclick="addAccount()">${B('Ku dar oo gal','Add & log in')}</button>`;
}
function switchTo(i){
  getAccts();S.accounts=getAccts();S.me={...S.accounts[i]};S.loggedOut=false;save();
  $('loginOv').classList.remove('on');closeSettings();viewUser=null;feedTab='foryou';render();toast('@'+S.me.handle);
}
function addAccount(){
  const n=$('newAcc').value.trim();if(!n)return;
  let h=n.toLowerCase().replace(/[^a-z0-9_]/g,'')||'user'+(Date.now()%10000);
  const A=getAccts();while(A.some(a=>a.handle===h))h+=Math.floor(Math.random()*10);
  A.push({name:n.slice(0,30),handle:h,bio:''});switchTo(A.length-1);
}
function logout(){if(!confirm(B('Ma hubtaa inaad ka baxdo?','Log out?')))return;S.loggedOut=true;save();closeSettings();showLogin()}
function showLogin(){$('loginBody').innerHTML=accountsHTML();$('loginOv').classList.add('on')}
/* time & well-being */
function usage(){try{const u=JSON.parse(localStorage.getItem('sl_use'))||{};const d=new Date().toDateString();return u.d===d?u:{d,m:0}}catch(e){return{d:new Date().toDateString(),m:0}}}
let sessMin=0;
function startUsage(){setInterval(()=>{
  if(document.hidden)return;
  const u=usage();u.m+=0.5;sessMin+=0.5;try{localStorage.setItem('sl_use',JSON.stringify(u))}catch(e){}
  const lim=S.set.limit;
  if(lim&&u.m>=lim&&Date.now()>(S.set.snooze||0)){document.querySelectorAll('video').forEach(v=>v.pause());S.set.snooze=Date.now()+10*60000;save();alert(B('Waxaad gaadhay xadka waqtiga maalinlaha ('+lim+' daqiiqo). Nasasho yar qaado 🌿','Daily limit reached ('+lim+' min). Take a short break 🌿'))}
  const br=S.set.breakEvery;
  if(br&&sessMin>=br){sessMin=0;toast(B('⏰ Waqti nasasho ah! '+br+' daqiiqo ayaad daawatay','⏰ Time for a break! You watched for '+br+' minutes'))}
},30000)}

/* ============ RENDER ============ */
function render(){
  updDot();
  if(cur==='home'){const keep=activeId;if(keep&&!focusId)focusId=keep;renderFeed()}
  if(cur==='discover')renderDiscover();
  if(cur==='inbox')renderInbox();
  if(cur==='profile')renderProfile();
}
applyStatic();applySettings();render();startUsage();if(S.loggedOut)showLogin();checkLiveHash();
/* Android back button: close screens one by one */
window.appBack=function(){
  if($('loginOv').classList.contains('on'))return true;
  const ov=[...document.querySelectorAll('.ov.on')].pop();
  if(ov){ov.classList.remove('on');return true}
  if($('liveOv').classList.contains('on')){endLive();return true}
  if($('camOv').classList.contains('on')){closeCam();return true}
  if($('setPage').classList.contains('on')){backSet();return true}
  if(cur!=='home'){go('home');return true}
  return false;
};
/* resume playback when returning to the tab */
document.addEventListener('visibilitychange',()=>{if(document.hidden)document.querySelectorAll('video').forEach(v=>v.pause());else if(cur==='home'){const el=document.querySelector(`.reel[data-id="${activeId}"] video`);if(el&&el.src)tryPlay(el)}});
</script>
