<!DOCTYPE html>
<html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoomaaLink TikTok</title><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
.page{position:fixed;inset:0;display:none;flex-direction:column;background:#000}.page.on{display:flex}
.top{height:50px;display:flex;align-items:center;gap:12px;padding:0 10px;background:#000;overflow-x:auto;white-space:nowrap}
.top span{color:#888;font-weight:700}.top span.on{color:#fff;text-decoration:underline;text-decoration-thickness:3px;underline-offset:8px}
.feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}.feed::-webkit-scrollbar{display:none}
.post{height:calc(100vh - 110px);width:100vw;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.txt{font-size:36px;font-weight:900;text-align:center;padding:24px;line-height:1.25;text-shadow:0 2px 10px #000}
.right{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:5}
.rbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:0;color:#fff;font-size:20px}
.av{width:46px;height:46px;border-radius:50%;border:2px solid #fff;overflow:hidden;position:relative;background:#333}.av img{width:100%;height:100%;object-fit:cover}
.plus{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#fe2c55;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.bot{position:absolute;left:10px;bottom:8px;right:70px;z-index:5}
.nav{height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center}
.nav button{background:none;border:0;color:#888;font-size:10px;display:flex;flex-direction:column;align-items:center}.nav button.on{color:#fff}.nav button b{font-size:22px}
.nav.add{background:#fff;color:#000;width:42px;height:26px;border-radius:7px;font-weight:900;font-size:20px;box-shadow:-2px 0 0 #25f4ee,2px 0 0 #fe2c55;border:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center}.modal[hidden]{display:none}
.box{width:90%;max-width:380px;background:#fff;color:#000;border-radius:14px;padding:16px}.box input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin-bottom:8px;background:#f2f2f2}
.btn{width:100%;padding:12px;border-radius:8px;border:0;background:#fe2c55;color:#fff;font-weight:700;margin-bottom:6px}
</style></head><body>
<div class="page on" id="p-feed"><div class="top"><div style="border:2px solid #fff;padding:2px 6px;border-radius:5px;font-weight:900;font-size:12px">LIVE</div><span>Community</span><span>Sarthe</span><span>Following</span><span>Shop</span><span class="on">For You</span><span style="margin-left:auto">⌕</span></div><div class="feed" id="feed"></div>
<div class="nav"><button class="on"><b>⌂</b>Home</button><button><b>👥</b>Friends</button><button class="add" id="add">+</button><button><b>💬</b>Inbox</button><button id="goPro"><b>👤</b>Profile</button></div></div>
<div class="page" id="p-pro" style="background:#fff;color:#000;overflow:auto"><div style="padding:12px;display:flex;justify-content:space-between"><span>✏️</span><div style="display:flex;gap:12px"><span>👁️ 4</span><span id="menu">☰</span></div></div>
<div style="display:flex;justify-content:space-between;padding:0 12px"><div><div style="font-size:22px;font-weight:900">༄Ha_Qoslin_Sin... <span style="background:#fe2c55;color:#fff;font-size:11px;padding:2px 7px;border-radius:10px">9+</span></div><div style="color:#777;font-size:13px">@bahal_ceyjiye</div>
<div style="display:flex;gap:16px;margin-top:8px;font-weight:800"><div>3,763<br><span style="font-weight:400;color:#666;font-size:11px">Following</span></div><div>3,739<br><span style="font-weight:400;color:#666;font-size:11px">Followers</span></div><div>8,702<br><span style="font-weight:400;color:#666;font-size:11px">Likes</span></div></div></div>
<div style="width:84px;height:84px;border-radius:50%;overflow:hidden;border:2px solid #eee"><img src="https://i.pravatar.cc/200?u=bahal" style="width:100%;height:100%;object-fit:cover"></div></div>
<div style="padding:12px;font-size:13px;white-space:pre-wrap">IXTIRAAMKU
"waa toban, Sagaal Ka mid ah waa Aamusnaan, Halka Soo harayna waa in Loo Tanaasulo Kuwa Ay Garashadu Ku Yar tahay"</div>
<div style="display:flex;gap:8px;padding:0 12px;overflow:auto"><button style="background:#f1f1f1;border:0;padding:7px 12px;border-radius:18px;font-size:12px;font-weight:700">👥 TikTok Studio</button><button style="background:#f1f1f1;border:0;padding:7px 12px;border-radius:18px;font-size:12px;font-weight:700">👜 Your orders</button><button style="background:#f1f1f1;border:0;padding:7px 12px;border-radius:18px;font-size:12px;font-weight:700">👛 Balance</button></div>
</div>
<div class="modal" id="auth" hidden><div class="box"><h3>Gal / Isdiiwaangeli</h3><input id="n" placeholder="Magac"><input id="e" placeholder="Email ama 252..."><input id="p" type="password" placeholder="Password 6+"><button class="btn" id="ok">Gal</button><button class="btn" style="background:#eee;color:#000" id="tog">Sign Up</button><button class="btn" style="background:#f5f5f5;color:#000" id="cl">Xir</button></div></div>
<script>
const QORAALADA = [
"Waxbarashu maaha wax caajis ah marka aad xaqiiqsato inay tahay tigidka xornimada.",
"Noloshu waa safar dheer, marna ha quusan riyadaada! 💪",
"IXTIRAAMKU waa toban, Sagaal Ka mid ah waa Aamusnaan ❤️",
"Qof kasta oo ku jecel asaga oo ku neceb - Ixtiraamku waa muhiim",
"Ha welwelin berri, maanta samee waxa aad awoodo ✨",
"Soomaalinimo waa sharaf, dhaqanka waa hidde",
];
const VIDEOS = [
{id:"jNQXAC9IVRw",title:"Hees kaban macaan 🎸 #soomaali #kaban",user:"liibaan_music"},
{id:"dQw4w9WgXcQ",title:"Qosolkii maanta 😂 #qosol",user:"qosol_tv"},
{id:"9bZkp7q19f0",title:"Muqdisho caawa waa qurux 🌙",user:"soomaalink"},
{id:"OPf0YbXqDmQ",title:"Kaban live - cod macaan 🔥",user:"kaban_star"},
];
const BG=["#1a1a1a","#2c1810","#102018","#1a1025","#251a1a","#101a25"];
const thumb=id=>`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const $=id=>document.getElementById(id);
let mine=[];try{mine=JSON.parse(localStorage.getItem("mine")||"[]")}catch(e){}
let likes={};try{likes=JSON.parse(localStorage.getItem("likes")||"{}")}catch(e){}
let users=[];try{users=JSON.parse(localStorage.getItem("users")||"[]")}catch(e){}
let cur=null;try{cur=JSON.parse(localStorage.getItem("cur")||"null")}catch(e){}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function allPosts(){let txts=QORAALADA.map((t,i)=>({title:t,user:"wisdom_so",type:"text",bg:BG[i%BG.length]}));let vids=VIDEOS.map(v=>({...v,type:"video"}));return [...txts,...vids,...mine].sort(()=>0.5-Math.random());}
function render(){let posts=allPosts();$("feed").innerHTML=posts.map(v=>{
if(v.type==="text"){return `<div class="post" style="background:${v.bg}" data-id="${esc(v.title)}"><div class="txt">${esc(v.title)}</div>
<div class="right"><div class="av"><img src="https://i.pravatar.cc/100?u=${v.user}"><div class="plus">+</div></div>
<button class="rbtn" data-like="${esc(v.title)}">♡</button><div style="font-size:11px">${likes[v.title]?1:0}</div>
<button class="rbtn">💬</button><div style="font-size:11px">Add 1st</div><button class="rbtn">🔖</button><div style="font-size:11px">0</div><button class="rbtn">↗</button><div style="font-size:11px">1</div></div>
<div class="bot"><div style="font-weight:800">@${esc(v.user)} • Text</div><div style="font-size:13px;margin-top:3px">${esc(v.title).slice(0,60)}</div></div></div>`}else{
return `<div class="post" data-id="${v.id}"><div style="position:absolute;inset:0;background:url(${thumb(v.id)}) center/cover;filter:blur(25px) brightness(.35)"></div><img class="th" src="${thumb(v.id)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><div class="pl" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;background:rgba(0,0,0,.45);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px">▶</div>
<div class="right"><div class="av"><img src="https://i.pravatar.cc/100?u=${v.user}"><div class="plus">+</div></div><button class="rbtn" data-like="${v.id}">♥</button><div style="font-size:11px">${likes[v.id]?'12K':'279K'}</div><button class="rbtn">💬</button><div style="font-size:11px">693</div><button class="rbtn">🔖</button><div style="font-size:11px">5K</div><button class="rbtn">↗</button><div style="font-size:11px">3K</div></div>
<div class="bot"><div style="font-weight:800">@${esc(v.user)}</div><div style="font-size:13px;margin-top:3px">${esc(v.title)}</div></div></div>`}
}).join("");
document.querySelectorAll(".post").forEach(p=>{
let lt=0;p.addEventListener("click",e=>{
if(e.target.closest(".rbtn"))return;let now=Date.now();
if(now-lt<300){let id=p.dataset.id;likes[id]=true;save("likes",likes);render();let h=document.createElement("div");h.textContent="❤️";h.style.cssText="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:70px;animation:pop.7s forwards";p.appendChild(h);setTimeout(()=>h.remove(),700);return;}
if(p.querySelector("iframe")){p.querySelector("iframe").remove();p.querySelector(".th").style.display="block";p.querySelector(".pl").style.display="flex";return;}
if(p.dataset.id && p.dataset.id.length===11){let id=p.dataset.id;p.querySelector(".th").style.display="none";p.querySelector(".pl").style.display="none";let f=document.createElement("iframe");f.style.cssText="position:absolute;inset:0;width:100%;height:100%;border:0";f.src="https://www.youtube.com/embed/"+id+"?autoplay=1&mute=0&playsinline=1&rel=0";f.allow="autoplay; encrypted-media; fullscreen";p.prepend(f);}
lt=now;});});
$("feed").onclick=e=>{let b=e.target.closest("[data-like]");if(b){if(!cur){$("auth").hidden=false;return}let id=b.dataset.like;likes[id]=!likes[id];if(!likes[id])delete likes[id];save("likes",likes);render();}};}
$("goPro").onclick=()=>{document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));$("p-pro").classList.add("on")}
document.querySelectorAll(".page")[0].querySelectorAll(".nav button")[0].onclick=()=>{document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));document.getElementById("p-feed").classList.add("on")}
$("p-pro").querySelector(".nav").querySelectorAll("button")[0].onclick=()=>{document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));document.getElementById("p-feed").classList.add("on")}
let su=false;$("add").onclick=()=>{if(!cur){$("auth").hidden=false;return}let t=prompt("Qoraalkaaga qor (ama YouTube link):");if(!t)return;let m=(t.match(/(?:youtu\.be\/|v=|shorts\/)([A-Za-z0-9_-]{11})/)||[])[1];if(m){mine.push({id:m,title:"Muuqaal cusub",user:cur.name,type:"video"})}else{mine.push({title:t,user:cur.name,type:"text",bg:BG[Math.floor(Math.random()*BG.length)]})}save("mine",mine);render()}
$("cl").onclick=()=>{$("auth").hidden=true}
$("tog").onclick=()=>{su=!su;$("ok").textContent=su?"Isdiiwaangeli":"Gal";$("tog").textContent=su?"Gal":"Sign Up"}
$("ok").onclick=()=>{let em=$("e").value.trim(),pa=$("p").value.trim(),na=$("n").value.trim();if(!em||pa.length<6){alert("Email iyo password 6+");return}if(su){if(users.find(u=>u.email===em)){alert("Jira");return}let u={email:em,pass:pa,name:na||em.split("@")[0]};users.push(u);save("users",users);cur=u;save("cur",u);$("auth").hidden=true;render()}else{let u=users.find(u=>u.email===em&&u.pass===pa);if(!u){alert("Khalad");return}cur=u;save("cur",u);$("auth").hidden=true;render()}}
render();
</script></body></html>
